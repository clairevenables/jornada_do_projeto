  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    }

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

or>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:10.5px;font-weight:700;letter-spacing:0.12em;color:#1B1D22\">DOCUMENTAÇÃO PEDAGÓGICA<\u002Fdiv>\n                  <div style=\"margin-top:8px;display:flex;flex-direction:column;gap:5px\">\n                    <sc-for list=\"{{ lesson.documentacao }}\" as=\"item\" hint-placeholder-count=\"2\">\n                      <div style=\"display:grid;grid-template-columns:11px 1fr;gap:6px;font-size:11.5px;line-height:1.5;color:#1B1D22\"><span style=\"color:#A6B6CB\">—<\u002Fspan><span>{{ item }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:14px;font-size:10.5px;line-height:1.5;color:#5A5C64\"><span style=\"font-weight:600;color:#1B1D22\">BNCC:<\u002Fspan> {{ lesson.bncc }}<\u002Fdiv>\n                  <div style=\"margin-top:4px;font-size:10.5px;line-height:1.5;color:#5A5C64\"><span style=\"font-weight:600;color:#1B1D22\">Eixos Transversais:<\u002Fspan> {{ lesson.eixos }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:26px;font-size:11px;font-weight:700;letter-spacing:0.14em;color:#1B1D22\">COMO CONDUZIR<\u002Fdiv>\n              <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:14px\">\n                <sc-for list=\"{{ lesson.momentos }}\" as=\"m\" hint-placeholder-count=\"4\">\n                  <div style=\"background:#FAFBFC;border:1px solid #E4E5E9;border-radius:10px;padding:14px 16px\">\n                    <div style=\"display:flex;align-items:center;gap:10px\">\n                      <div style=\"{{ m.numStyle }}\">{{ m.n }}<\u002Fdiv>\n                      <div style=\"font-size:13px;font-weight:700;color:#1B1D22\">{{ m.title }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"margin-top:10px;display:flex;flex-direction:column;gap:7px\">\n                      <sc-for list=\"{{ m.bullets }}\" as=\"b\" hint-placeholder-count=\"3\">\n                        <div style=\"display:grid;grid-template-columns:11px 1fr;gap:6px;font-size:11.5px;line-height:1.55;color:#1B1D22;text-wrap:pretty\"><span style=\"color:#A6B6CB\">—<\u002Fspan><span>{{ b }}<\u002Fspan><\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"{{ lesson.tipStyle }}\">\n                <div style=\"font-size:10px;font-weight:700;letter-spacing:0.16em;margin-bottom:5px\">DICA!<\u002Fdiv>\n                <div style=\"font-size:12.5px;line-height:1.55;color:#1B1D22\"><span style=\"font-weight:700\">Apoio:<\u002Fspan> {{ lesson.dicaApoio }}<\u002Fdiv>\n                <div style=\"margin-top:6px;font-size:12.5px;line-height:1.55;color:#1B1D22\"><span style=\"font-weight:700\">Ampliação:<\u002Fspan> {{ lesson.dicaAmpliacao }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:26px;display:flex;align-items:baseline;gap:12px\">\n                <div style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;color:#1B1D22;white-space:nowrap\">MATERIAIS<\u002Fdiv>\n                <div style=\"height:1px;background:#1B1D22;flex:1;transform:translateY(-3px)\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:12px;font-size:11px;line-height:1.55;color:#1B1D22\"><span style=\"font-weight:600\">Caderno de Aprendizagem Integrada:<\u002Fspan> {{ lesson.materiaisIntegrada }}<\u002Fdiv>\n              <div style=\"margin-top:6px;font-size:11px;line-height:1.55;color:#1B1D22\"><span style=\"font-weight:600\">Atividades Fazer e Brincar:<\u002Fspan> {{ lesson.materiaisFazerBrincar }}<\u002Fdiv>\n\n              <div style=\"margin-top:26px;display:flex;align-items:baseline;gap:12px\">\n                <div style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;color:#1B1D22;white-space:nowrap\">DA BIBLIOTECA DIGITAL<\u002Fdiv>\n                <div style=\"height:1px;background:#1B1D22;flex:1;transform:translateY(-3px)\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:13px;display:grid;grid-template-columns:1fr 1fr;gap:8px 30px\">\n                <sc-for list=\"{{ lessonLibrary }}\" as=\"entry\" hint-placeholder-count=\"4\">\n                  <div sc-camel-on-click=\"{{ entry.go }}\" style=\"display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid #EDEEF2;border-radius:8px;cursor:pointer;transition:background .18s,border-color .18s\" style-hover=\"background:#F4F6FA;border-color:#C7D3E4\">\n                    <span style=\"{{ entry.dotStyle }}\"><\u002Fspan>\n                    <span style=\"font-size:11.5px;line-height:1.3;color:#1B1D22\">{{ entry.title }}<\u002Fspan>\n                    <span style=\"{{ entry.seenStyle }}\">{{ entry.seenLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n\n        <!-- BIBLIOTECA: TILES -->\n        <sc-if value=\"{{ isBiblioTiles }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:34px 0 56px 0;animation:viewIn .28s both\">\n            <div style=\"width:720px;margin:0 auto\">\n              <div style=\"font-size:28px;font-weight:400;line-height:1.05;letter-spacing:-0.02em;color:#1B1D22\">Biblioteca <span style=\"font-weight:700;color:#123F72\">Digital<\u002Fspan><\u002Fdiv>\n              <div style=\"margin-top:8px;font-size:12.5px;color:#5A5C64\">Rotinas, estratégias, materiais e propostas usadas nos roteiros.<\u002Fdiv>\n              <div style=\"margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n                <sc-for list=\"{{ categories }}\" as=\"cat\" hint-placeholder-count=\"4\">\n                  <div sc-camel-on-click=\"{{ cat.go }}\" style=\"{{ cat.style }}\" style-hover=\"transform:translateY(-2px);box-shadow:0 12px 26px rgba(21,24,29,.09)\">\n                    <div style=\"{{ cat.kickerStyle }}\">{{ cat.typeLabel }}<\u002Fdiv>\n                    <div style=\"margin-top:7px;font-size:19px;font-weight:700;color:#1B1D22;line-height:1.15\">{{ cat.name }}<\u002Fdiv>\n                    <div style=\"margin-top:8px;font-size:11.5px;line-height:1.5;color:#5A5C64\">{{ cat.subtitle }}<\u002Fdiv>\n                    <div style=\"margin-top:12px;font-size:11px;font-weight:600;color:#8A8C93\">{{ cat.count }} entradas<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- BIBLIOTECA: LIST -->\n        <sc-if value=\"{{ isBiblioList }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:34px 0 56px 0;animation:viewIn .28s both\">\n            <div style=\"width:720px;margin:0 auto\">\n              <div style=\"{{ catKickerStyle }}\">{{ cat.typeLabel }}<\u002Fdiv>\n              <div style=\"margin-top:8px;font-size:28px;font-weight:700;color:#1B1D22;line-height:1.1\">{{ cat.name }}<\u002Fdiv>\n              <div style=\"margin-top:8px;font-size:12.5px;line-height:1.5;color:#5A5C64;max-width:560px\">{{ cat.subtitle }}<\u002Fdiv>\n              <div style=\"margin-top:22px;display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ catItems }}\" as=\"item\" hint-placeholder-count=\"4\">\n                  <div sc-camel-on-click=\"{{ item.go }}\" style=\"{{ item.style }}\" style-hover=\"transform:translateY(-2px);box-shadow:0 10px 24px rgba(21,24,29,.08)\">\n                    <div style=\"display:flex;align-items:center;gap:10px\">\n                      <span style=\"{{ item.codeStyle }}\">{{ item.code }}<\u002Fspan>\n                      <span style=\"{{ item.seenStyle }}\">{{ item.seenLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"margin-top:7px;font-size:16px;font-weight:700;color:#1B1D22\">{{ item.title }}<\u002Fdiv>\n                    <div style=\"margin-top:5px;font-size:11.5px;line-height:1.5;color:#5A5C64\">{{ item.summary }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- BIBLIOTECA: DETAIL -->\n        <sc-if value=\"{{ isBiblioDetail }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:34px 0 56px 0;animation:viewIn .28s both\">\n            <div style=\"width:720px;margin:0 auto\">\n              <div style=\"{{ entryKindStyle }}\">{{ entry.kind }}<\u002Fdiv>\n              <div style=\"margin-top:8px;font-size:30px;font-weight:700;color:#1B1D22;line-height:1.1\">{{ entry.title }}<\u002Fdiv>\n              <div style=\"margin-top:12px;height:1px;background:#E4E5E9\"><\u002Fdiv>\n              <div style=\"margin-top:16px;font-size:13.5px;line-height:1.6;color:#3A3C44;text-wrap:pretty\">{{ entry.summary }}<\u002Fdiv>\n\n              <div style=\"margin-top:26px;font-size:11px;font-weight:700;letter-spacing:0.14em;color:#1B1D22\">COMO CONDUZIR<\u002Fdiv>\n              <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ entry.steps }}\" as=\"step\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;background:#fff;border:1px solid #E4E5E9;border-radius:10px;padding:13px 15px\">\n                    <div style=\"{{ entry.numStyle }}\">{{ step.n }}<\u002Fdiv>\n                    <div style=\"font-size:12.5px;line-height:1.55;color:#1B1D22;padding-top:3px;text-wrap:pretty\">{{ step.t }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"{{ entryTipStyle }}\">\n                <div style=\"font-size:10px;font-weight:700;letter-spacing:0.16em;margin-bottom:5px\">DICA<\u002Fdiv>\n                <div style=\"font-size:12.5px;line-height:1.55;color:#1B1D22\">{{ entry.tip }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:26px;font-size:11px;font-weight:700;letter-spacing:0.14em;color:#1B1D22\">USADA EM<\u002Fdiv>\n              <sc-if value=\"{{ entry.hasUsedIn }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"margin-top:10px;display:flex;flex-direction:column;gap:6px\">\n                  <sc-for list=\"{{ entry.usedIn }}\" as=\"u\" hint-placeholder-count=\"2\">\n                    <div sc-camel-on-click=\"{{ u.go }}\" style=\"display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#123F72;cursor:pointer\" style-hover=\"color:#0c2a4e\">→ {{ u.label }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"margin-top:26px;padding-top:16px;border-top:1px solid #E4E5E9;display:flex;align-items:center;justify-content:space-between\">\n                <div sc-camel-on-click=\"{{ backToList }}\" style=\"font-size:11.5px;font-weight:600;color:#5A5C64;cursor:pointer\" style-hover=\"color:#1B1D22\">← {{ cat.name }}<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ markRead }}\" style=\"{{ readBtnStyle }}\" style-hover=\"opacity:.88\">{{ readLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- CADERNOS -->\n        <sc-if value=\"{{ isCadernos }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:34px 0 56px 0;animation:viewIn .28s both\">\n            <div style=\"width:720px;margin:0 auto\">\n              <div style=\"font-size:28px;font-weight:400;line-height:1.05;letter-spacing:-0.02em;color:#1B1D22\">Materiais da <span style=\"font-weight:700;color:#123F72\">Criança<\u002Fspan><\u002Fdiv>\n              <div style=\"margin-top:8px;font-size:12.5px;color:#5A5C64\">Páginas impressas distribuídas conforme a sequência das aulas.<\u002Fdiv>\n              <div style=\"margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n                <sc-for list=\"{{ books }}\" as=\"b\" hint-placeholder-count=\"3\">\n                  <div style=\"{{ b.style }}\">\n                    <div style=\"{{ b.stripStyle }}\"><\u002Fdiv>\n                    <div style=\"padding:22px 22px 22px 30px;display:flex;flex-direction:column;gap:7px;min-height:120px\">\n                      <div style=\"font-size:16px;font-weight:700;color:#1B1D22;line-height:1.2\">{{ b.title }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px;line-height:1.45;color:#5A5C64\">{{ b.desc }}<\u002Fdiv>\n                      <div style=\"margin-top:auto;font-size:10.5px;font-weight:600;color:#8A8C93\">{{ b.status }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:960}}\">\nconst C = { blue:'#123F72', teal:'#17AFB9', orange:'#E8912D', pink:'#D9245E' };\nconst TINT = { '#123F72':'#EEF3FA', '#17AFB9':'#E7F7F8', '#E8912D':'#FDF3E8', '#D9245E':'#FDECF2' };\n\nconst CATS = [\n  { id:'rot', name:'Rotinas', typeLabel:'Rotina', accent:C.blue,\n    subtitle:'Estruturas diárias que dão previsibilidade às experiências e liberam o educador para observar.' },\n  { id:'est', name:'Estratégias de ensino', typeLabel:'Estratégia', accent:C.teal,\n    subtitle:'Movimentos de facilitação que abrem a investigação e tornam o pensamento das crianças visível.' },\n  { id:'mat', name:'Materiais do educador', typeLabel:'Material', accent:C.orange,\n    subtitle:'Recursos impressos que apoiam a leitura compartilhada e a construção de vocabulário comum.' },\n  { id:'pro', name:'Propostas', typeLabel:'Proposta', accent:C.pink,\n    subtitle:'Propostas abertas escolhidas conforme os interesses e as necessidades observadas na turma.' }\n];\n\nconst LIBRARY = [\n  { id:'caixa', cat:'est', code:'EI5.EST.01', title:'Caixa Misteriosa', usedIn:['a1'],\n    summary:'Uma caixa fechada com objetos selecionados desperta a curiosidade da turma e abre a investigação antes de qualquer explicação do educador.',\n    steps:['Apresente a caixa fechada e peça que as crianças observem antes de tocar.','Convide algumas crianças a sentir o conteúdo sem olhar e descrever o que percebem.','Registre as hipóteses da turma em voz alta, sem confirmar nem corrigir.','Revele um objeto por vez e conecte cada revelação à Pergunta Norteadora.'],\n    tip:'Mantenha a caixa visível na sala durante a semana. Retomá-la nos dias seguintes ajuda as crianças a perceber como suas ideias mudaram.' },\n  { id:'partilha', cat:'est', code:'EI5.EST.02', title:'Roda de Partilha', usedIn:[],\n    summary:'Momento breve de fechamento em que as crianças compartilham uma descoberta, escolha ou pergunta do dia.',\n    steps:['Reúna a turma em círculo e relembre em uma frase o que foi feito.','Faça uma pergunta aberta: o que você descobriu hoje?','Garanta a vez de fala e escute sem completar as respostas.','Registre duas ou três falas literais para o Mural do Projeto.'],\n    tip:'Cinco minutos bastam. A regularidade importa mais do que a duração.' },\n  { id:'cartoes', cat:'mat', code:'EI5.MAT.01', title:'Cartões da História', usedIn:['a1'],\n    summary:'Cartões A3 com as ilustrações do paradidático na frente e o texto correspondente no verso, para leitura compartilhada com a turma toda.',\n    steps:['Organize os cartões na ordem da história antes da aula.','Segure o cartão voltado para a turma e leia o texto no verso.','Pause nas ilustrações e convide observações antes de virar o cartão.','Deixe os cartões acessíveis depois da leitura para releitura livre.'],\n    tip:'Marque no verso as pausas onde você quer fazer perguntas. Isso mantém o ritmo da leitura.' },\n  { id:'palavras', cat:'mat', code:'EI5.MAT.02', title:'Cartões de Palavras-Chave', usedIn:[],\n    summary:'Cartões com as palavras centrais do projeto, usados para construir vocabulário comum entre as crianças.',\n    steps:['Escolha até quatro palavras que a história introduz.','Apresente cada palavra junto de um objeto ou imagem correspondente.','Peça que as crianças usem a palavra em uma frase própria.','Fixe os cartões no Mural do Projeto ao final do dia.'],\n    tip:'Retome as mesmas palavras ao longo das três semanas em vez de introduzir novas a cada dia.' },\n  { id:'conto', cat:'rot', code:'EI5.ROT.01', title:'Rotina da Hora do Conto', usedIn:['a1','c1'],\n    summary:'Estrutura em três tempos para a leitura compartilhada: antes, durante e depois da história.',\n    steps:['Antes: ative conhecimentos prévios com a capa e as ilustrações.','Durante: leia com pausas curtas para previsões e conexões pessoais.','Depois: retome uma pergunta que ligue a história ao problema do projeto.','Registre uma fala de conexão pessoal de cada dia.'],\n    tip:'Leia a história inteira ao menos uma vez sem interrupções antes de trabalhar trechos isolados.' },\n  { id:'artes', cat:'rot', code:'EI5.ROT.02', title:'Rotina de Preparação de Artes Visuais', usedIn:[],\n    summary:'Sequência de preparação do espaço e dos materiais para que as crianças trabalhem com autonomia no Atelier de Artes.',\n    steps:['Defina a área de trabalho e a área de secagem antes da chegada das crianças.','Disponha os materiais em bandejas visíveis e ao alcance das crianças.','Teste cada objeto de impressão para conhecer as marcas que produz.','Combine com a turma como pegar, usar e devolver os materiais.'],\n    tip:'Menos materiais bem escolhidos geram mais exploração do que uma mesa cheia de opções.' },\n  { id:'organizacao', cat:'rot', code:'EI5.ROT.03', title:'Rotina de Organização', usedIn:['a1','a2','a3','b1','b2','b3','c1','c2','c3'],\n    summary:'Prática de arrumação compartilhada que encerra as experiências e desenvolve responsabilidade coletiva.',\n    steps:['Avise a turma cinco minutos antes do fim da atividade.','Combine quem cuida de cada material ou espaço.','Arrume junto com as crianças, sem substituí-las.','Verifique com a turma se o espaço está pronto para a próxima experiência.'],\n    tip:'Use sempre o mesmo sinal sonoro ou gesto para iniciar a arrumação.' },\n  { id:'jornada', cat:'rot', code:'EI5.ROT.04', title:'Rotina de Jornada do Projeto', usedIn:['a3','b3','c3'],\n    summary:'Momento de situar a turma nas fases do projeto e registrar o pensamento inicial das crianças no Mural.',\n    steps:['Apresente as fases do projeto no painel e indique onde a turma está.','Faça a Pergunta Norteadora e escute as primeiras respostas.','Registre respostas, perguntas e ideias com as palavras das crianças.','Explique que os registros poderão mudar conforme a turma descobrir mais.'],\n    tip:'Escreva as falas entre aspas e com o nome da criança. Isso torna a mudança de pensamento visível ao longo das semanas.' },\n  { id:'proposta', cat:'pro', code:'EI5.PRO.01', title:'Proposta: Plantar a Nossa Semente', usedIn:['a2'],\n    summary:'Sequência ilustrada para que cada criança plante a própria semente e leve o vaso para o lugar ensolarado combinado.',\n    steps:['Organize terra, sementes, regadores, colheres pequenas e os vasos em um espaço externo convidativo.','Pendure os cartões com a sequência ilustrada de cuidado à altura das crianças.','Deixe a criança seguir a sequência: encher o vaso, plantar, cobrir e regar.','Guie para o vocabulário de cuidado: terra, semente, raiz, regar, sol, sombra.'],\n    tip:'Dois cartões em branco na sequência convidam a turma a acrescentar os próprios passos de cuidado.' },\n  { id:'leitura-compartilhada', cat:'est', code:'EI5.EST.03', title:'Leitura Compartilhada', usedIn:['a1'],\n    summary:'Leitura em voz alta da história inteira, com voz e expressão, sem pausas para perguntas durante o texto.',\n    steps:['Leia a história do início ao fim sem parar para perguntas; as perguntas ficam para depois, no Picture Walk.','Use voz e expressão para marcar personagens e momentos-chave da narrativa.','Repita um gesto para cada ação que se repete na história e convide as crianças a fazer o gesto junto.','Encerre com uma frase de fechamento marcada, como \"Este conto se acabou... bate palma quem gostou!\"'],\n    tip:'Não pare o fluxo da leitura para comentar. O valor desta rotina é a imersão contínua na história.' },\n  { id:'picture-walk', cat:'est', code:'EI5.EST.04', title:'Picture Walk', usedIn:['a1'],\n    summary:'Revisão das ilustrações da história, sem reler o texto, para aprofundar observação e comparação entre páginas.',\n    steps:['Volte às ilustrações depois da leitura completa, sem reler o texto.','Olhe cada ilustração com a turma por alguns segundos antes de perguntar.','Pare em duas páginas-chave (início e fim) e compare o que mudou entre elas.','Use as perguntas da rotina Ver, Fazer, Sentir em cada parada.'],\n    tip:'Dê tempo de silêncio antes de perguntar. As primeiras respostas costumam vir de quem olha mais, não de quem fala primeiro.' },\n  { id:'ver-fazer-sentir', cat:'rot', code:'EI5.ROT.05', title:'Rotina: Ver, Fazer, Sentir', usedIn:['a1','a2'],\n    summary:'Três perguntas fixas que ajudam a criança a observar um espaço, descrever o que acontece nele e nomear como se sente.',\n    steps:['Pergunte: \"Como é este lugar?\" e escute descrições do espaço.','Pergunte: \"O que as pessoas estão fazendo (ou fariam) aqui?\"','Pergunte: \"Como elas estão se sentindo (ou se sentiriam)?\"','Anote as respostas para comparar depois, no mesmo lugar ou entre dois lugares diferentes.'],\n    tip:'Use sempre as três perguntas na mesma ordem. A repetição é o que torna a mudança de pensamento visível ao longo das semanas.' },\n  { id:'think-pair-share', cat:'est', code:'EI5.EST.05', title:'Think-Pair-Share', usedIn:['a1'],\n    summary:'Estratégia de três passos que garante que toda criança pense antes de falar: primeiro sozinha, depois em dupla, depois para o grupo.',\n    steps:['Faça a pergunta e peça que cada criança pense em silêncio, sozinha, por alguns segundos.','Convide as crianças a conversar em duplas sobre o que pensaram.','Escute algumas respostas das duplas em voz alta para o grupo.','Anote as falas que quiser retomar depois, com o nome de quem falou.'],\n    tip:'O tempo de pensar sozinho não é opcional. Sem ele, as mesmas poucas crianças respondem sempre primeiro.' },\n  { id:'brincar-ar-livre', cat:'rot', code:'EI5.ROT.06', title:'Rotina do Brincar ao Ar Livre', usedIn:['a2'],\n    summary:'Estrutura de preparação, combinados e transição que organiza o tempo de brincadeira livre ou guiada nos espaços externos.',\n    steps:['Apresente as propostas do dia percorrendo cada área com a turma.','Revise os combinados de segurança, espera da vez e cuidado com os materiais.','Observe antes de intervir; junte-se à brincadeira sem tomar a frente.','Avise a turma antes do fim do tempo e siga a Rotina de Organização para a transição.'],\n    tip:'Deixe que as crianças escolham onde brincar primeiro. A escuta de onde elas querem ir já é parte da observação do dia.' },\n  { id:'aquarela', cat:'pro', code:'EI5.PRO.02', title:'Proposta: Experimentar com Aquarela', usedIn:['a2'],\n    summary:'Ateliê ao ar livre com aquarela e giz de cera para explorar onde há natureza em dois parquinhos e no desenho do pátio da própria escola.',\n    steps:['Ofereça aquarela, pincéis de espessuras diferentes, potes com água, panos e giz de cera preto nos cavaletes.','Mostre como controlar a quantidade de água para a tinta escorrer ou não.','Convide a pintar apenas onde há natureza nas imagens dos dois parquinhos.','Depois, peça para desenhar o pátio da escola com giz de cera e pintar só a natureza encontrada.'],\n    tip:'Um escorrido fora do desejado não é erro. O foco é experimentar o material, não terminar uma pintura \"bonita\".' },\n  { id:'movimento', cat:'pro', code:'EI5.PRO.03', title:'Proposta: Correr, Pular, Subir', usedIn:['a2'],\n    summary:'Brincadeira livre de movimento com o que a escola já tem — amarelinha, bambolês, cordas e bolas — para explorar o corpo ao ar livre.',\n    steps:['Organize os materiais disponíveis (amarelinha, bambolês, cordas, bolas) em um espaço seguro.','Deixe as crianças criarem os próprios desafios de movimento.','Observe como ajustam corrida, salto e equilíbrio aos materiais escolhidos.','Ofereça apoio para decisões seguras, sem assumir a escolha por elas.'],\n    tip:'A brincadeira dirigida pela criança não precisa de um objetivo fechado. Observe o que ela já está praticando sozinha.' },\n  { id:'canvas-projeto', cat:'est', code:'EI5.EST.06', title:'Guia: Canvas do Projeto', usedIn:['a3','b3'],\n    summary:'Cartaz vivo que reúne o problema, por que ele importa, quem é afetado e a ideia da turma, atualizado conforme o projeto avança.',\n    steps:['Apresente o Canvas como um cartaz que muda: quando a turma descobrir algo novo, tira o que não serve mais e põe outra coisa.','Preencha O Problema a partir do que as páginas e falas do dia mostraram.','Preencha Por Que Importa Para Nós e Quem É Afetado, registrando as falas da turma em balões.','Marque qualquer ideia inicial em Nossa Ideia como suposição, não como solução.'],\n    tip:'Nunca ofereça a solução no campo Nossa Ideia. Se a turma travar, aponte para os registros do dia e espere.' },\n  { id:'centros', cat:'rot', code:'EI5.ROT.07', title:'Rotina dos Centros de Aprendizagem', usedIn:['c2'],\n    summary:'Estrutura de preparação, combinados e observação que organiza a brincadeira livre entre vários cantinhos ao mesmo tempo.',\n    steps:['Apresente cada cantinho percorrendo a sala com a turma antes de liberar a escolha livre.','Revise os combinados: esperar a vez, cuidar dos materiais e avisar antes de trocar de lugar.','Observe antes de intervir; junte-se à brincadeira sem tomar a frente de nenhum grupo.','Avise a turma antes do fim do tempo e siga a Rotina de Organização para a transição.'],\n    tip:'Deixe que as crianças circulem entre os cantinhos no próprio ritmo. A escolha de onde ficar já é parte da observação do dia.' },\n  { id:'compartilhamento-roda', cat:'est', code:'EI5.EST.07', title:'Compartilhamento em Roda', usedIn:['c3'],\n    summary:'Estrutura de fechamento em roda que convida cada criança a responder de novo a uma pergunta central do projeto, usando frases de apoio.',\n    steps:['Releia em voz alta algumas respostas iniciais da turma à mesma pergunta.','Repita a pergunta central devagar e ofereça frases de apoio para começar a resposta.','Garanta a vez de fala sem completar nem corrigir o que a criança disser.','Registre as respostas finais ao lado das iniciais, para comparar o que mudou.'],\n    tip:'Não corrija uma resposta que pareça \"errada\". O que importa é comparar o pensamento de antes com o de agora.' },\n  { id:'historia-da-bia', cat:'pro', code:'EI5.PRO.04', title:'Cantinho: A História da Bia', usedIn:['c2'],\n    summary:'Cantinho de investigação com a Caixa Misteriosa e os cartões do paradidático, para recontar a história e escolher quem conta a fase Imersão.',\n    steps:['Disponha a Caixa Misteriosa com a semente dourada e os cartões do paradidático em uma bandeja.','Deixe as crianças manusearem a semente e recontarem a história com os cartões.','Convide o grupo a colocar os cartões em ordem e conversar sobre o que a Bia percebeu e fez.','Ajude o grupo a decidir junto quem vai contar a fase Imersão na apresentação.'],\n    tip:'Siga as próprias palavras das crianças ao recontar. O reconto não precisa repetir o texto original.' },\n  { id:'reconstruir-modelo', cat:'pro', code:'EI5.PRO.05', title:'Cantinho: Reconstruir o Nosso Modelo', usedIn:['c2'],\n    summary:'Cantinho de construção com fotografias da semana anterior e materiais soltos, para reconstruir o protótipo e preparar quem vai apresentá-lo.',\n    steps:['Disponha as fotografias das construções da semana e os materiais soltos usados nelas.','Convide o grupo a reconstruir a versão escolhida pela turma, comparando com as fotos.','Faça perguntas e pequenos desafios para ampliar a resolução de problemas e o pensamento espacial.','Ajude o grupo a decidir quem apresenta o protótipo e quem faz o pedido ao diretor.'],\n    tip:'Fotografe a reconstrução antes de guardar. A mesa deste cantinho vira a mesa da apresentação no dia seguinte.' },\n  { id:'como-era-como-pode-ser', cat:'pro', code:'EI5.PRO.06', title:'Cantinho: Como Era e Como Pode Ser', usedIn:['c2'],\n    summary:'Ateliê de arte com as páginas Onde Tem Natureza? e os balões de fala, para revisitar os próprios registros e pintar como o pátio poderia ficar.',\n    steps:['Disponha as páginas Onde Tem Natureza?, os balões de fala e os materiais de aquarela e papel.','Convide as crianças a revisitar os próprios registros e conversar sobre o que pintaram e por quê.','Convide a pintar como o pátio poderia ficar se a proposta da turma acontecesse.','Ajude o grupo a decidir quem vai contar a fase Investigação na apresentação.'],\n    tip:'Apoie a criança a falar sobre a própria criação antes de avançar. A conversa importa tanto quanto a pintura.' },\n  { id:'nossas-duas-ideias', cat:'pro', code:'EI5.PRO.07', title:'Cantinho: As Nossas Duas Ideias', usedIn:['c2'],\n    summary:'Cantinho de linguagem com as Cartas do Parquinho e os desenhos das 2 ideias mais escolhidas, para comparar os parquinhos e recontar a sequência.',\n    steps:['Disponha as Cartas do Parquinho, as páginas Ideias na Cabeça e os desenhos das 2 ideias mais escolhidas.','Convide as crianças a revisitar as cartas e comparar os parquinhos que criaram.','Convide o grupo a colocar os Cartões da História da Proposta em ordem e recontar.','Ajude o grupo a decidir quem vai contar a fase Criação na apresentação.'],\n    tip:'Estenda o vocabulário do projeto nas conversas deste cantinho: é aqui que ele mais se repete.' },\n  { id:'a-entrevista', cat:'pro', code:'EI5.PRO.08', title:'Cantinho: A Entrevista', usedIn:['c2'],\n    summary:'Cantinho de faz de conta com os Cartões de Entrevista preenchidos, para encenar a pesquisa trocando os papéis de quem pergunta e quem responde.',\n    steps:['Disponha os Cartões de Entrevista preenchidos, crachás e as cartelas do parquinho.','Convide duas crianças a encenar a entrevista, uma perguntando e outra respondendo.','Troque os papéis a cada rodada e siga as histórias que o grupo criar.','Ajude o grupo a decidir quem vai contar a pesquisa na apresentação.'],\n    tip:'Amplie a negociação e a cooperação entrando na brincadeira sem assumir nenhum dos papéis.' },\n  { id:'contar-votos-outra-vez', cat:'pro', code:'EI5.PRO.09', title:'Cantinho: Contar os Votos Outra Vez', usedIn:['c2'],\n    summary:'Cantinho de jogos e matemática com os Cartões de Entrevista, fichas de contagem e o gráfico de colunas, para recontar e comparar os resultados.',\n    steps:['Disponha os Cartões de Entrevista, fichas de contagem, o gráfico de colunas e cartões de números.','Convide as crianças a contar novamente e comparar as 2 colunas do gráfico.','Peça que ordenem e digam quantos votos de diferença há entre as colunas.','Ajude o grupo a decidir quem vai explicar o gráfico na apresentação.'],\n    tip:'Ajuste o desafio ao que cada criança já compreende: contar de novo, comparar ou calcular a diferença.' }\n];\n\nconst WEEKS = [\n  { n:1, fase:'Imersão', milestone:'Explorar o problema', color:C.blue, active:true, days:[\n    { n:1, title:'Hora do Conto · Lançamento do Projeto', code:'S1.D1.A1', id:'a1', ready:true },\n    { n:2, title:'Brincar ao Ar Livre', code:'S1.D1.A2', id:'a2', ready:true },\n    { n:3, title:'Painel do Projeto', code:'S1.D1.A3', id:'a3', ready:true }\n  ]},\n  { n:2, fase:'Investigação', milestone:'Investigar', color:C.teal, active:true, days:[\n    { n:1, title:'Oficina de Descobertas · Ideias na Cabeça', code:'S2.D1.A1', id:'b1', ready:true },\n    { n:2, title:'Oficina de Descobertas · Pesquisa com Amigos', code:'S2.D1.A2', id:'b2', ready:true },\n    { n:3, title:'Painel do Projeto · Ler os Resultados', code:'S2.D1.A3', id:'b3', ready:true }\n  ]},\n  { n:3, fase:'Criação e Partilha', milestone:'Criar e apresentar', color:C.pink, active:true, days:[\n    { n:1, title:'Hora do Conto · A História da Nossa Proposta', code:'S3.D1.A1', id:'c1', ready:true },\n    { n:2, title:'Centros de Aprendizagem · Contar a Nossa Jornada', code:'S3.D1.A2', id:'c2', ready:true },\n    { n:3, title:'Painel do Projeto · Apresentação e Encerramento', code:'S3.D1.A3', id:'c3', ready:true }\n  ]}\n];\n\nconst LESSONS = [\n  { id:'a1', code:'S1.D1.A1', title:'Hora do Conto · Lançamento do Projeto', fase:'Imersão', modo:'Dirigida pelo educador', minutos:30, color:C.blue,\n    objetivo:'Lançar o projeto com a Caixa Misteriosa, ler Bia e a Semente Dourada em leitura compartilhada e apresentar a Pergunta Norteadora.',\n    resultados:['Levanta hipóteses sobre o que está dentro de uma caixa fechada, usando pistas de peso, som e tamanho.','Compara duas ilustrações do mesmo lugar, nomeando o que mudou no espaço, no que as pessoas fazem e em como elas se sentem.','Relaciona a história com o que já sentiu e com lugares reais que conhece.','Reconhece o livro de plantas da história como uma fonte que ensina a cuidar de algo.'],\n    bncc:'EI03EF01; EI03EF07; EI03EO04; EI03ET01; EI03ET03', eixos:'EI05EMP01; EI05SEL04',\n    documentacao:['Observe se as crianças nomeiam sensações ao comparar as ilustrações, e não apenas o que mudou no espaço.','Anote as falas que aparecerem na conexão com a escola. Elas voltam no Painel do Projeto, na A3.'],\n    momentos:[\n      { title:'Lançamento do Projeto', bullets:['Coloque a Caixa Misteriosa fechada no centro da roda, sem dizer nada. Espere as crianças perceberem a caixa. Pergunte: \"O que vocês acham que tem aqui dentro?\"','Balance a caixa devagar, perto do ouvido de algumas crianças. Pergunte: \"É pesado ou leve?\"; \"Que barulho é esse?\"','Abra a caixa devagar e tire a semente dourada. Mostre para todos e depois passe de mão em mão. Pergunte: \"Por que essa semente é diferente?\"; \"O que será que acontece se a gente plantar?\" Escute todas as respostas sem corrigir.','Guarde a semente na caixa, à vista das crianças. Diga: \"Esta semente é da história que eu vou contar hoje. Ela fica guardada aqui, porque ela vai voltar.\"'] },\n      { title:'Antes da Leitura', bullets:['Convide as crianças a ir até o espaço da leitura, seguindo a Rotina da Hora do Conto.','Mostre a capa nos Cartões A3 do Paradidático 1. Pergunte: \"O que vocês veem na capa?\" Se precisar, ofereça a frase de apoio \"Eu vejo...\"','Aponte para a semente na capa e leia o título: Bia e a Semente Dourada. Diga: \"Esta é a Bia.\"'] },\n      { title:'Durante a Leitura', bullets:['Leia a história inteira em Leitura Compartilhada, com voz e expressão. Não pare para fazer perguntas.','Faça um gesto para cada ação que se repete (plantar, regar, esperar, olhar para cima). Convide as crianças a fazer o gesto e falar junto.','Encerre com: \"Este conto se acabou... bate palma quem gostou!\" Agradeça às crianças por ouvirem e participarem.'] },\n      { title:'Depois da Leitura', bullets:['Volte às ilustrações seguindo o Picture Walk, sem reler o texto. Olhe cada ilustração com a turma por alguns segundos antes de perguntar.','Pare na página do lugar no começo da história. Faça as 3 perguntas de Ver, Fazer, Sentir, nesta ordem.','Avance pelas páginas em que a Bia planta e cuida. Pare na página do livro de plantas. Diga: \"Este livro ensina como cuidar de uma planta. A gente vai usar um igual hoje.\"','Pare na página do playground, no fim da história. Repita as 3 perguntas de Ver, Fazer, Sentir, na mesma ordem.','Coloque as 2 páginas lado a lado. Pergunte: \"O que mudou deste lugar para este?\"','Aponte para a página do playground. Pergunte: \"Você já se sentiu como as crianças desta página?\" Ofereça a frase de apoio \"Eu já fiquei assim quando...\"','Comece o Think-Pair-Share. Diga: \"Pensem sozinhos primeiro: na nossa escola, onde é parecido com este lugar cinza? E onde é parecido com este lugar verde?\" Espere alguns segundos em silêncio, depois convide a conversar em duplas.','Escute 4 ou 5 respostas e anote as falas.','Diga a Pergunta Norteadora em voz alta e devagar: \"A nossa pergunta deste projeto é esta: Como a natureza muda o jeito que a gente se sente, brinca e aprende?\" Repita mais uma vez e deixe a pergunta em aberto. As respostas voltam no Painel do Projeto, na A3.','Aponte para fora da sala. Diga: \"Agora a gente vai lá fora descobrir isso com o nosso corpo.\"'] }\n    ],\n    dica:{ apoio:'Nas páginas do começo, faça só \"Como é este lugar?\". Acrescente as outras 2 perguntas de Ver, Fazer, Sentir apenas na página do playground.', ampliacao:'Convide as crianças a apontar uma ilustração do meio da história e dizer se aquele lugar está mais parecido com o começo ou com o fim, e por quê.' },\n    materiais:{ integrada:'Sem página nesta aula.', fazerBrincar:'Sem página nesta aula. Materiais do educador: Caixa Misteriosa com semente dourada e Cartões A3 do Paradidático 1.' } },\n  { id:'a2', code:'S1.D1.A2', title:'Brincar ao Ar Livre', fase:'Investigação', modo:'Guiada pelo educador', minutos:40, color:C.orange,\n    objetivo:'Investigar ao ar livre como estar na natureza muda o que a gente faz e sente, experimentar a aquarela em 2 parquinhos que já têm natureza, desenhar o parquinho da escola e plantar a semente que a turma vai cuidar.',\n    resultados:['Controla e ajusta os movimentos do corpo ao correr, pular, equilibrar-se e criar percursos seguros.','Coordena habilidades manuais ao plantar, regar, desenhar e utilizar materiais de pintura.','Compara materiais e efeitos, observando propriedades como a espessura dos pincéis e a quantidade de água na aquarela.','Consulta imagens de instrução e observa o ambiente para buscar informações sobre o cuidado com as plantas e a presença da natureza.','Comunica ideias, escolhas, descobertas e sentimentos sobre a brincadeira, reconhecendo as próprias preferências e ouvindo os colegas.'],\n    bncc:'EI03CG02; EI03CG05; EI03EF01; EI03ET01; EI03ET03', eixos:'EI05SEL01; EI05SEL04',\n    documentacao:['Tire fotos que mostrem como as crianças brincam e fazem escolhas nos espaços com natureza.','Registre falas e desenhos que revelem como elas se sentem e o que percebem nesses espaços.'],\n    momentos:[\n      { title:'Prepare', bullets:['Leve as crianças pelo espaço ao ar livre e apresente as 3 propostas de hoje. Em cada área pergunte: \"O que vocês acham que podemos fazer aqui?\"','Retome a Rotina do Brincar ao Ar Livre e revise os combinados: esperar a vez, segurança e como deixar os materiais para a próxima criança. Convide as crianças a vestirem o avental.','Antes de soltar as crianças, faça a conversa de antes com as 3 perguntas de Ver, Fazer, Sentir. Anote 3 falas para retomar no fim.','Convide as crianças a escolherem onde querem brincar e depois dê espaço para que elas conduzam.','Proposta 1 · Plantar a Nossa Semente: terra, sementes, regadores e os vasos, com os cartões de cuidado pendurados à altura das crianças.','Proposta 4 · Experimentar com Aquarela: aquarela, pincéis, água e giz de cera nos cavaletes, pintando só a natureza nos 2 parquinhos e depois no pátio da escola.','Proposta 6 · Correr, Pular, Subir: amarelinha, bambolês, cordas e bolas, brincadeira livre de movimento.'] },\n      { title:'Observe e Guie a Brincadeira', bullets:['Observe as crianças brincando antes de decidir onde o apoio é necessário.','Junte-se às crianças na brincadeira sem tomar a frente. Use perguntas e provocações para guiá-las com delicadeza em direção a um objetivo de aprendizagem.'] },\n      { title:'Organização e Transição', bullets:['Avise as crianças antes do fim do tempo de brincar.','Siga a Rotina de Organização para guardar tudo e fazer a transição. As crianças tiram o avental e levam as páginas molhadas para o varal.','Antes de sair, repita as 3 perguntas de Ver, Fazer, Sentir e compare com 1 das falas anotadas no começo.','Leve as páginas Onde Tem Natureza? para o Painel do Projeto e faça a transição para a próxima atividade.'] }\n    ],\n    dica:{ apoio:'Segure o pano ao lado da criança e convide-a a encostar o pincel antes de cada pincelada, até ela pegar o gesto. Aponte junto o primeiro elemento de natureza.', ampliacao:'Convide as crianças confiantes a usar o escorrido de propósito dentro de uma forma, para a flor ou a folha ficarem com 2 tons.' },\n    materiais:{ integrada:'Experimentar com Aquarela — página horizontal com 2 imagens (jardim vertical e horta elevada) para pintar apenas os elementos de natureza.', fazerBrincar:'Onde Tem Natureza? (desenho do pátio da escola) e Cartões Como Cuidar de uma Planta (sequência ilustrada de 4 passos).' } },\n  { id:'a3', code:'S1.D1.A3', title:'Painel do Projeto', fase:'Investigação', modo:'Instrução Explícita', minutos:20, color:C.pink,\n    objetivo:'Montar o Painel do Projeto com as páginas e as falas do dia, preencher os primeiros campos do Canvas do Projeto e chegar à Pergunta da Missão a partir do que a turma descobriu.',\n    resultados:['Explica a própria página, dizendo o que pintou e por quê.','Identifica na Jornada do Projeto onde a turma está e marca com o adesivo.','Nomeia o problema do parquinho da escola a partir dos próprios desenhos.','Propõe uma primeira ideia para trazer mais natureza, a partir da história e das imagens.'],\n    bncc:'EI03EO04; EI03EF01; EI03ET01', eixos:'EI05EMP01; EI05SEL04',\n    documentacao:['Observe quais crianças conseguem explicar a própria página sem que o educador descreva primeiro.','Fotografe o Painel e o Canvas do Projeto completos no fim do dia. Eles são o ponto zero da comparação na última semana.'],\n    momentos:[\n      { title:'Pendurar as Páginas e os Balões · 6 min', bullets:['Convide cada criança a pendurar a própria página Onde Tem Natureza? no painel, com o nome visível, onde ela escolher.','Enquanto penduram, leia em voz alta 3 ou 4 Balões de Fala do Brincar ao Ar Livre, dizendo o nome de quem falou. Convide essas crianças a colarem o próprio balão ao lado das páginas.','Dê o tempo dessa etapa como tempo de olhar: \"Podem chegar perto e ver o que os colegas fizeram.\"'] },\n      { title:'Marcar a Jornada do Projeto · 3 min', bullets:['Convide as crianças a colarem os adesivos das fases Imersão e Investigação na própria Jornada do Projeto, em exposição. Diga: \"Hoje a gente descobriu um problema e já começou a investigar.\"'] },\n      { title:'Preencher o Canvas do Projeto · 6 min', bullets:['Apresente o Canvas do Projeto. Diga: \"Este cartaz fica com a gente até o fim do projeto.\"','Preencha O Problema: \"Qual é o problema do nosso parquinho?\" Registre 1 fala em um balão.','Preencha Por Que Importa Para Nós: \"Por que a gente quer mais natureza aqui?\" Registre 2 falas.','Preencha Quem É Afetado: \"Quem mais brinca aqui além da nossa turma?\" Registre cada grupo em um balão separado.'] },\n      { title:'Chegar à Pergunta da Missão · 5 min', bullets:['Leia os 3 campos apontando para cada um e conecte: o problema, quem é afetado, e como a turma se sentiu lá fora.','Prenda a tira da Pergunta da Missão abaixo da Pergunta Norteadora e leia devagar: \"Como podemos trazer mais natureza para 1 lugar da nossa escola onde as crianças brincam?\"','Abra Nossa Ideia: \"O que a Bia fez na história? E o que tinha nos 2 parquinhos que vocês pintaram?\" Registre cada ideia em um balão.','Marque o campo como suposição: \"A gente ainda não sabe se são as certas. Semana que vem a gente pergunta pras outras crianças.\" Siga a Rotina de Organização e faça a transição.'] }\n    ],\n    dica:{ apoio:'Peça que apontem para uma página no painel em vez de responder de cabeça, e escreva a partir do que apontaram.', ampliacao:'Convide as crianças confiantes a escreverem o próprio nome ao lado da fala registrada, ou a tentarem escrever uma palavra com escrita espontânea.' },\n    materiais:{ integrada:'Jornada do Projeto — página destacável, uma por criança, exposta ao lado do Painel durante as 3 semanas.', fazerBrincar:'Folha de Adesivos das Fases (para marcar Imersão e Investigação na Jornada do Projeto).' } }\n,\n  { id:'b1', code:'S2.D1.A1', title:'Oficina de Descobertas · Ideias na Cabeça', fase:'Investigação', modo:'Dirigida pelo educador', minutos:30, color:C.blue,\n    objetivo:'Gerar muitas possibilidades para o espaço escolhido, classificá-las entre natureza e feito por pessoas, e cada criança montar o seu próprio parquinho de natureza.',\n    resultados:['Conta e nomeia ideias para o espaço escolhido.','Acrescenta ideias próprias por meio de desenho.','Reconhece letras conhecidas, em especial as do próprio nome.','Classifica elementos entre natureza e feito por pessoas, e explica o critério usado.','Escolhe elementos para o próprio parquinho e explica por quê.','Representa o parquinho escolhido por meio de desenho.'],\n    bncc:'EI03EF01; EI03EF09; EI03ET01; EI03ET05', eixos:'EI05EMP01; EI05SEL04; EI05SEL05',\n    documentacao:['Vocabulário e significado: nomeia as ideias do balão e as próprias, e explica o que quis dizer.','SEA e letras: reconhece a letra pescada, em especial as do próprio nome.','Classificação: coloca a carta no grupo certo (natureza ou feito por pessoas) e diz o critério.','Escolha: diz por que quer ou não quer um elemento no próprio parquinho.'],\n    momentos:[\n      { title:'Contextualize a Aprendizagem', bullets:['Relembre o Canvas do Projeto e a Pergunta da Missão: \"Como podemos trazer mais natureza para 1 lugar da nossa escola onde as crianças brincam?\"','Apresente a página Ideias na Cabeça. Mostre o personagem com o balão de pensamento.','Diga: \"Ele está pensando em ideias para o parquinho. Vamos ver quais ideias já estão na cabeça dele?\"','Leia as 5 ideias já impressas no balão em voz alta, uma a uma.','Pergunte: \"Essas ideias são da natureza ou feitas por pessoas?\" Classifique junto com a turma.','Diga: \"Agora vocês vão pensar em mais ideias, e a gente vai separar as cartas também.\"','Apresente as Cartas do Parquinho e a vara de pescar com ímã.'] },\n      { title:'Prática Lúdica', bullets:['Espalhe as cartas com a face das letras para baixo. Convide as crianças a \"pescar\" uma carta por vez com a vara magnética.','Ao pescar, a criança nomeia a letra e diz se já a reconhece no próprio nome.','Vire a carta e mostre a imagem do outro lado (um elemento de natureza ou feito por pessoas).','Pergunte: \"Essa carta vai para o grupo da natureza ou das pessoas?\" Convide a criança a colocar no cartaz certo.','Repita até que todas as cartas estejam classificadas nos 2 cartazes: VEM DA NATUREZA e FOI FEITO PELAS PESSOAS.','Conte com a turma quantas cartas ficaram em cada grupo.'] },\n      { title:'Fazer e Brincar', bullets:['Entregue a cartela O Meu Parquinho de Natureza, com uma grade de 6 espaços e uma área de desenho.','Eu Faço: escolha e desenhe o primeiro elemento de natureza que quer no seu parquinho, pensando em voz alta sobre a escolha.','Nós Fazemos: convide a turma a escolher o segundo elemento juntos, discutindo as opções.','Você Faz: cada criança escolhe e desenha os próprios elementos restantes na cartela, sozinha ou com apoio.','Circule perguntando: \"Por que você quer isso no seu parquinho?\" Registre as respostas.'] },\n      { title:'Organização e Transição', bullets:['Guarde as Cartas do Parquinho no Centro de Aprendizagem, disponíveis para o resto da semana.','Guarde as cartelas O Meu Parquinho de Natureza no portfólio de cada criança.'] }\n    ],\n    dica:{ apoio:'Segure a vara junto com a criança nas primeiras pescadas e ofereça 2 cartas por vez para classificar.', ampliacao:'Convide as crianças a explicar como os elementos escolhidos funcionariam juntos no espaço real, e a acrescentar no desenho algo que não estava nas cartas.' },\n    materiais:{ integrada:'Ideias na Cabeça — personagem com balão de pensamento contendo 5 ideias impressas (natureza e feitas por pessoas) e espaço para a criança acrescentar mais 5.', fazerBrincar:'Cartas do Parquinho (26 cartas, uma por letra, com imagem no verso) e vara de pescar com ímã; cartela O Meu Parquinho de Natureza (grade de 6 espaços + área de desenho).' } },\n  { id:'b2', code:'S2.D1.A2', title:'Oficina de Descobertas · Pesquisa com Amigos', fase:'Investigação', modo:'Guiada pelo educador', minutos:30, color:C.orange,\n    objetivo:'Contar quantas pessoas escolheram cada coisa, comparar as quantidades e descobrir o que é mais popular.',\n    resultados:['Procura e conta exemplos em uma cena, sem pular nem repetir.','Registra o numeral correspondente à quantidade contada.','Compara quantidades e diz qual é mais popular.','Pergunta a outras pessoas entre 2 opções e conta as respostas.','Marca 1 resposta por pessoa entrevistada, sem repetir nem omitir.'],\n    bncc:'EI03ET01; EI03ET04; EI03ET07; EI03EO04', eixos:'EI05SEL04; EI05SEL05; EI05EMP01',\n    documentacao:['Busca sistemática: procura a cena inteira sem repetir nem pular exemplares.','Contagem: conta sem pular nem recontar e diz o total.','Registro: escreve o numeral correspondente à quantidade contada.','Comparação: diz qual é mais popular e como sabe.','Correspondência um a um: faz exatamente 1 marca por pessoa entrevistada. Marcar a própria preferência em vez da do entrevistado é evidência de que essa correspondência ainda não se separou do desejo próprio, e não um erro de contagem.'],\n    momentos:[\n      { title:'Contextualize a Aprendizagem', bullets:['Apresente a página O Que Você Prefere no Parque? Mostre a cena com mais de 20 crianças brincando.','Aponte para os 4 itens: sorvete de chocolate, sorvete de baunilha, escorregador e árvore.','Pergunte: \"Quantas crianças escolheram cada coisa?\" Modele a contagem de um item junto com a turma.','Registre juntos o numeral na caixa correspondente.','Diga: \"Agora vocês vão contar os outros e descobrir quais são as 2 mais populares da nossa turma.\"'] },\n      { title:'Prática Lúdica · O Que Você Prefere?', bullets:['Organize rodadas de votação usando as cartelas do parquinho feitas na aula anterior.','A cada rodada, leia 2 opções em voz alta. Cada criança aponta ou levanta a mão para a que prefere.','Conte os votos de cada opção com a turma, marcando em grupos.','Deixe as crianças puxarem as rodadas mesmo que a pergunta saia trocada — o importante é a prática de contar e comparar.','Repita por 3 ou 4 rodadas com perguntas diferentes.'] },\n      { title:'Fazer e Brincar · Cartão de Entrevista', bullets:['Entregue o Cartão de Entrevista (2 quadros de desenho na frente, grade de marcação no verso) com furo e cordão.','Eu Faço: escolha uma pergunta de preferência e modele como perguntar e marcar a resposta no cartão.','Nós Fazemos: a turma entrevista um colega juntos, marcando a resposta.','Você Faz: cada criança usa o cartão para entrevistar crianças de outras turmas, perguntando qual das 2 opções preferem e marcando 1 resposta por pessoa.','Combine com os educadores das outras turmas o horário e o número de crianças antes da saída.'] },\n      { title:'Organização e Transição', bullets:['Recolha os Cartões de Entrevista preenchidos e guarde para a contagem na próxima aula.','Pergunte: \"Quantas pessoas vocês entrevistaram?\" Registre o total com cada criança.','Siga a Rotina de Organização e faça a transição.'] }\n    ],\n    dica:{ apoio:'Na página, ofereça 1 item por vez e deixe que marquem cada exemplar com o dedo ou com uma ficha antes de contar.', ampliacao:'Convide as crianças confiantes a dizer quantos de diferença há entre os 2 números, e a prever qual vai ganhar antes de contar.' },\n    materiais:{ integrada:'O Que Você Prefere no Parque? — cena ampla de parque para procurar, contar e registrar 4 itens (sorvete de chocolate, sorvete de baunilha, escorregador, árvore) e circular as 2 mais populares da turma.', fazerBrincar:'Cartão de Entrevista (A5, com furo e cordão) — 2 quadros de desenho na frente e grade de marcação de 20 posições no verso, para entrevistar crianças de outras turmas.' } },\n  { id:'b3', code:'S2.D1.A3', title:'Painel do Projeto · Ler os Resultados', fase:'Investigação', modo:'Instrução Explícita', minutos:30, color:C.pink,\n    objetivo:'Contar os votos das 2 propostas, montar um gráfico de colunas, comparar os resultados e atualizar o campo Nossa Ideia no Canvas do Projeto.',\n    resultados:['Conta as marcas registradas nos Cartões de Entrevista.','Monta um gráfico de colunas a partir da contagem.','Compara as colunas do gráfico e identifica a proposta mais votada.','Reconhece que a escolha da turma pode mudar por causa da opinião de outras crianças.'],\n    bncc:'EI03ET01; EI03ET07; EI03ET08; EI03EO04', eixos:'EI05EMP01; EI05FIN01',\n    documentacao:['Registre a fala da criança ao dizer qual proposta recebeu mais votos e como ela sabe.'],\n    momentos:[\n      { title:'Contar os Votos · 10 min', bullets:['Reúna todos os Cartões de Entrevista feitos pela turma na aula anterior.','Separe os votos por proposta e conte as marcas em grupos de 5, riscando cada grupo em vez de contar de 1 em 1.','Registre o total de votos de cada proposta.'] },\n      { title:'Montar o Gráfico · 8 min', bullets:['Apresente o gráfico de colunas em branco, uma coluna para cada proposta.','Convide as crianças a colorir uma unidade da coluna para cada voto contado.','Compare as 2 colunas prontas: \"Qual ficou mais alta?\"'] },\n      { title:'Escolher a Proposta e Marcar a Jornada · 8 min', bullets:['Pergunte: \"Qual proposta a nossa turma e as outras turmas preferem?\" Aponte para a coluna mais alta.','Volte ao Canvas do Projeto e atualize o campo Nossa Ideia com a proposta escolhida.','Convide as crianças a colarem o adesivo da fase Criação e Experimentação na Jornada do Projeto.','Se a proposta escolhida não for a preferida da maioria da turma, não conserte — essa é a aprendizagem, e vale nomear em voz alta.'] },\n      { title:'Lançar a Construção · 4 min', bullets:['Diga: \"Durante esta semana, a gente vai construir um modelo da nossa ideia lá fora.\"','Explique que a turma vai brincar ao ar livre com peças soltas e desenhar o modelo em um ateliê ao ar livre.','Convide as crianças a observar o espaço real escolhido, pensando em como as partes da ideia funcionariam ali.'] }\n    ],\n    dica:{ apoio:'Conte as marcas em grupos de 5, riscando cada grupo, em vez de contar de 1 em 1.', ampliacao:'Convide as crianças confiantes a dizer quantos votos de diferença há entre as 2 colunas.' },\n    materiais:{ integrada:'Jornada do Projeto — a criança cola o adesivo da fase Criação e Experimentação.', fazerBrincar:'Os Cartões de Entrevista da aula anterior, reunidos para a contagem, e o gráfico de colunas montado em sala.' } }\n,\n  { id:'c1', code:'S3.D1.A1', title:'Hora do Conto · A História da Nossa Proposta', fase:'Apresentação e Reflexão', modo:'Dirigida pelo educador', minutos:30, color:C.blue,\n    objetivo:'Reconhecer como um relato oral de experiência organiza acontecimentos e evidências em uma sequência clara, criando cartões visuais para contar a história da proposta da turma.',\n    resultados:['Identifica a finalidade de um relato oral de experiência.','Reconhece que o relato apresenta os acontecimentos em uma ordem compreensível.','Usa palavras como primeiro, depois, então, por isso e no final para conectar ideias.','Seleciona acontecimentos importantes da jornada do projeto.','Usa o gráfico da pesquisa como evidência para explicar uma decisão.','Justifica a posição de uma imagem ou acontecimento na sequência.'],\n    bncc:'EI03EF01; EI03EF04; EI03EO04; EI03ET07', eixos:'EI05SEL04; EI05EMP03; EI05EMP05',\n    documentacao:['Observe se a criança diferencia um acontecimento importante de um detalhe que pode ficar de fora.','Registre uma explicação que conecte evidência e decisão, como: \"Esta ideia vem depois da pesquisa porque o gráfico mostrou que mais crianças escolheram ela.\"'],\n    momentos:[\n      { title:'Antes da Leitura', bullets:['Siga a Rotina da Hora do Conto para conduzir o grupo até o espaço da leitura.','Retome um trecho conhecido de Bia e a Semente Dourada em que a Bia percebe um problema, busca informações e decide o que fazer. Pergunte: \"Se a Bia quisesse contar para alguém como teve uma ideia e o que fez, por onde deveria começar?\"','Apresente 3 imagens do trecho fora de ordem e convide as crianças a organizá-las. Pergunte: \"Como vocês descobriram o que vem primeiro?\" Depois: \"O que ficaria difícil de entender se começássemos pelo final?\"','Nomeie o gênero. Diga: \"Este tipo de texto é um relato de experiência. Ele conta algo que realmente aconteceu, seguindo uma ordem que ajuda quem escuta a compreender.\"','Apresente o vocabulário: primeiro, depois, então, por isso e no final.'] },\n      { title:'Durante a Leitura', bullets:['Releia o trecho selecionado sem interrupções. Na segunda leitura, faça poucas pausas para destacar a organização do relato.','No momento em que a Bia percebe o problema, pergunte: \"Esta parte ajuda a explicar o quê?\" Amplie: \"Este é o começo. Primeiro, a Bia percebeu um problema.\"','Quando a Bia busca informações, pergunte: \"O que ela fez depois de perceber o problema?\" Quando ela toma uma decisão, pergunte: \"O que ajudou a Bia a decidir?\"','Modele a ligação causal. Diga: \"A Bia descobriu do que a planta precisava. Por isso, conseguiu decidir como cuidar dela.\" Reconte o trecho brevemente com os conectores e encerre dizendo: \"Este conto se acabou... bate palma quem gostou!\"'] },\n      { title:'Depois da Leitura · Criar os Cartões da História da Proposta', bullets:['Leve as crianças até o Painel do Projeto e explique que a turma também viveu uma experiência real que precisa ser contada ao diretor.','Apresente misturados o registro do problema, as cartelas do parquinho, um cartão de entrevista, o gráfico e o protótipo. Pergunte: \"Qual destes registros mostra o começo da nossa história?\"','Organize a sequência coletivamente, cartão por cartão, usando os conectores: 1 O problema, \"Primeiro, percebemos que...\" · 2 As 2 ideias, \"Depois, imaginamos duas possibilidades...\" · 3 A pesquisa, \"Então, entrevistamos crianças de outras turmas...\"','No cartão 4 O que o gráfico mostrou, conduza a leitura dos números: \"Nós entrevistamos crianças. Quantas escolheram a Ideia 1 e quantas escolheram a Ideia 2?\" Pergunte: \"Qual coluna tem mais?\" Depois: \"O que isso nos ajuda a concluir?\" Complete os cartões 5 O protótipo e 6 Nosso pedido, registrando o pedido em uma frase curta.','Distribua os cartões entre pequenos grupos e convide cada grupo a selecionar ou produzir a imagem da sua parte. Reúna os cartões e leia a sequência completa. Pergunte: \"Alguém que não participou conseguiria entender?\"; \"Está faltando alguma parte importante?\"'] },\n      { title:'Organização e Transição', bullets:['Organize os 6 cartões na ordem e deixe-os junto ao Painel do Projeto.','Explique que serão usados nos Centros de Aprendizagem.','Peça que guardem seus materiais no lugar combinado e siga a Rotina de Organização.'] }\n    ],\n    dica:{ apoio:'Se as crianças estiverem com dificuldade, ofereça 2 imagens e pergunte qual aconteceu primeiro.', ampliacao:'Se as crianças estiverem confiantes, convide-as a ligar 2 cartões usando depois, então ou por isso. Não transforme os cartões em roteiro escrito com falas completas — eles ajudam a lembrar ideias, não a decorar frases. O gráfico precisa ser usado como evidência, não apenas mostrado, e o ensaio completo da apresentação acontece só na próxima aula.' },\n    materiais:{ integrada:'Sem página individual nesta aula. A produção é coletiva e fica no Painel do Projeto.', fazerBrincar:'Cartões da História da Proposta — 6 cartões grandes e reutilizáveis (o problema, as 2 ideias, a pesquisa, o que o gráfico mostrou, o protótipo, nosso pedido), cada um com título, ícone, espaço para registro e frase de apoio no verso. Banco de Palavras: história, contar, primeiro, depois, então, por isso, no final, descobrir, mostrar, pedir.' } },\n  { id:'c2', code:'S3.D1.A2', title:'Centros de Aprendizagem · Contar a Nossa Jornada', fase:'Apresentação e Reflexão', modo:'Guiada pelo educador', minutos:30, color:C.orange,\n    objetivo:'Revisitar os registros das 3 semanas em 6 cantinhos, 1 por fase do projeto, e decidir em grupo quem vai contar cada parte da jornada ao diretor.',\n    resultados:['Revisita os próprios registros das 3 semanas e reconhece o que fez em cada fase.','Conta uma parte da jornada da turma, usando os registros como apoio.','Assume e troca papéis ao encenar a entrevista.','Explica o que o gráfico mostra sobre as preferências das crianças entrevistadas.','Participa da decisão do grupo sobre quem vai contar aquela parte.'],\n    bncc:'EI03EO03; EI03EF01; EI03EF04; EI03ET07', eixos:'EI05SEL03; EI05SEL04; EI05EMP03',\n    documentacao:['Observe como cada grupo decide quem vai falar, e se a escolha é do grupo ou de uma criança só.','Registre uma fala que mostre a criança ligando um registro à parte da história que ele conta.'],\n    momentos:[\n      { title:'Prepare', bullets:['Leve as crianças pelos diferentes cantinhos preparados para hoje. Em cada área pergunte: \"O que vocês acham que podemos fazer aqui?\"','Retome a Rotina dos Centros de Aprendizagem e revise os combinados: esperar a vez, segurança e como deixar os materiais para a próxima criança.','Explique a tarefa do dia. Diga: \"Amanhã o diretor vem. Cada cantinho conta um pedaço da nossa história. Vocês vão olhar tudo o que fizeram e escolher quem conta.\"'] },\n      { title:'Percorra os 6 Cantinhos', bullets:['Cantinho 1 · Investigação e Descoberta — A História da Bia: a Caixa Misteriosa e os cartões do paradidático, para recontar e escolher quem conta a fase Imersão.','Cantinho 2 · Construção e Engenharia — Reconstruir o Nosso Modelo: as fotografias da semana e os materiais soltos, para reconstruir o protótipo e escolher quem apresenta.','Cantinho 3 · Ateliê de Arte — Como Era e Como Pode Ser: as páginas Onde Tem Natureza? e aquarela, para pintar como o pátio poderia ficar e escolher quem conta a fase Investigação.','Cantinho 4 · Linguagem e Letramento — As Nossas Duas Ideias: as Cartas do Parquinho e os Cartões da História da Proposta, para comparar e recontar, e escolher quem conta a fase Criação.','Cantinho 5 · Faz de Conta e Pequenos Mundos — A Entrevista: os Cartões de Entrevista preenchidos, para encenar a pesquisa e escolher quem a conta.','Cantinho 6 · Jogos, Matemática e Manipulativos — Contar os Votos Outra Vez: os Cartões de Entrevista e o gráfico de colunas, para recontar e escolher quem explica o gráfico.'] },\n      { title:'Observe e Guie a Brincadeira', bullets:['Observe as crianças brincando antes de decidir onde o apoio é necessário. Veja como exploram os materiais, interagem com os colegas e resolvem problemas.','Junte-se às crianças na brincadeira sem tomar a frente. Use perguntas e provocações para guiá-las com delicadeza em direção a um objetivo de aprendizagem.'] },\n      { title:'Organização e Transição', bullets:['Avise as crianças antes do fim do tempo de brincar.','Siga a Rotina de Organização para guardar tudo e fazer a transição para a próxima atividade.','Antes de sair, reúna a turma e confirme em voz alta quem vai contar cada parte, apontando para o cantinho de onde a escolha veio. Deixe cada cantinho montado como está, porque ele é a mesa da apresentação.'] }\n    ],\n    dica:{ apoio:'Se uma criança estiver insegura, ofereça um papel de mostrar, apontar ou entregar em vez de falar.', ampliacao:'Se as crianças estiverem confiantes, convide-as a responder a uma pergunta inesperada feita por um co
