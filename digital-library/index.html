lega no papel de diretor. A escolha de quem fala é do grupo, não do educador — se um grupo travar, pergunte quem quer contar esta parte e espere; se ninguém quiser, ofereça que 2 crianças contem juntas.' },\n    materiais:{ integrada:'Sem página individual nesta aula. As evidências são registradas pelo educador em fotografias, falas e observações.', fazerBrincar:'Nenhuma página nova. Todos os materiais vêm das aulas anteriores.' } },\n  { id:'c3', code:'S3.D1.A3', title:'Painel do Projeto · Apresentação e Encerramento', fase:'Apresentação e Reflexão', modo:'Dirigida pelo educador, com participação ativa das crianças', minutos:30, color:C.pink,\n    objetivo:'Apresentar ao diretor a proposta criada pela turma, percorrendo as 6 mesas da jornada, receber uma decisão real e responder outra vez à Pergunta Norteadora.',\n    resultados:['Comunica uma parte da proposta usando fala, gesto, imagem, gráfico ou protótipo.','Explica como a pesquisa ajudou a escolher a ideia final.','Responde à Pergunta Norteadora usando evidências do projeto.','Escuta e responde às perguntas do diretor.','Compara as ideias iniciais com o que compreende ao final.','Reconhece a própria participação e a contribuição dos colegas.'],\n    bncc:'EI03EF01; EI03EO03; EI03EO04; EI03ET04; EI03ET07', eixos:'EI05SEL03; EI05SEL04; EI05EMP03; EI05EMP05',\n    documentacao:['Registre uma resposta final à Pergunta Norteadora que mostre mudança de pensamento.','Observe como a criança usa o gráfico, o protótipo ou outro registro para apoiar a explicação.','Filme ou fotografe a resposta do diretor. É a evidência central do teste de componentes.'],\n    momentos:[\n      { title:'Preparar a Chegada', bullets:['Reúna a turma diante do Painel e retome os 6 cartões na ordem.','Confirme quem fala em cada mesa e convide as crianças a irem para os seus lugares. Garanta que quem prefere não falar tenha um papel de mostrar, apontar ou entregar.','Relembre: \"Vocês não precisam decorar. Os cartões, o gráfico, o protótipo e os colegas ajudam a contar a história.\"'] },\n      { title:'Percorrer as 6 Mesas', bullets:['Receba o diretor e explique brevemente o objetivo do encontro. Convide-o a percorrer as mesas na ordem da jornada.','Mesa 1 · Imersão: \"Primeiro, a gente ouviu a história da Bia...\" e o que a turma viu no pátio.','Mesa 2 · Investigação: \"Então a gente foi lá fora ver com o corpo.\" A criança mostra a página quase sem cor ao lado da pintura de como poderia ficar.','Mesa 3 · Criação: \"Depois cada um fez o seu parquinho.\" As 2 ideias mais escolhidas aparecem nos desenhos.','Mesa 4 · A pesquisa: \"Então a gente perguntou para outras crianças: isto ou aquilo?\" O grupo pode encenar a entrevista com o diretor.','Mesa 5 · O gráfico: a turma lê os números contados e aponta qual coluna tem mais, explicando o que isso ajudou a decidir.','Mesa 6 · O protótipo e o pedido: \"Por isso a gente construiu este modelo.\" As crianças explicam como funciona, onde ficaria e quem cuidaria, e fecham com o pedido ao diretor.','Convide o diretor a fazer 2 ou 3 perguntas ao longo do percurso. Permita respostas coletivas e consulta aos registros.'] },\n      { title:'Receber a Decisão', bullets:['Reúna a turma no Painel e convide o diretor a explicar o que decidiu, por quê, e o que acontece depois.','Registre no Registro da Decisão do Diretor: o que apresentamos, o que o diretor decidiu, o que acontece agora. Prenda no Painel.','Pergunte à turma: \"O que o diretor decidiu? O que vai acontecer agora? Precisamos mudar ou descobrir alguma coisa?\"','Não trate uma resposta parcial ou negativa como fracasso.'] },\n      { title:'Responder Outra Vez à Pergunta Norteadora', bullets:['Leia algumas respostas iniciais da Semana 1 e retome a pergunta: \"Como a natureza muda o jeito que a gente se sente, brinca e aprende?\"','Conduza o Compartilhamento em Roda e ofereça as frases de apoio: \"Agora eu penso que a natureza...\"; \"Eu descobri que...\"; \"Antes eu pensava... Agora eu penso...\"','Registre as respostas finais em Balões de Resposta Final e coloque junto às iniciais. Pergunte: \"O que mudou? O que a gente sabe agora?\"','Convide as crianças a colarem os adesivos das fases Apresentação e Avaliação e Reflexão na própria Jornada do Projeto. Diga: \"A gente chegou no fim. Olhem o caminho todo.\"'] },\n      { title:'Certificados e Sementes Douradas', bullets:['Convide o diretor a entregar um Certificado de Participação para cada criança, reconhecendo uma contribuição observável. Todas as crianças recebem.','Apresente os vasos plantados na Semana 1 e entregue o brinde Sementes Douradas: o vaso identificado, a planta ou semente, os cartões de cuidado e o registro de descobertas.','Retome os cuidados em casa: local com luz adequada, observar a terra, regar quando necessário, acompanhar as mudanças, pedir ajuda a um adulto.','Diga: \"O projeto termina hoje na escola, mas o cuidado com a Semente Dourada continua em casa.\"','Feche olhando o Painel completo com a turma e siga a Rotina de Organização.'] }\n    ],\n    dica:{ apoio:'Se uma criança não quiser falar, permita que mostre, aponte ou acompanhe um colega. Se as respostas finais forem breves, use fotografias e registros como apoio.', ampliacao:'Combine com o diretor antes: \"sim, com uma condição\" é a resposta mais útil, porque dá à turma algo concreto e mantém o trabalho vivo. Não conserte o Painel nem o protótipo para ficarem mais bonitos antes da visita — funcionam porque são das crianças.' },\n    materiais:{ integrada:'Jornada do Projeto — a criança cola os adesivos das fases Apresentação e Avaliação e Reflexão e vê o caminho inteiro marcado. A página volta para casa com a criança.', fazerBrincar:'Nenhuma página nova. Os Cartões da História da Proposta e os Adesivos das Fases vêm das aulas anteriores.' } }\n];\n\nconst OUTCOMES = [\n  { title:'Hora do Conto', color:C.blue, mode:'Dirigida pelo educador', bncc:'EI03TS03; EI03EF01', sel:'EI05SEL04; EI05SEL01',\n    results:['Faz previsões sobre a história a partir da capa e das ilustrações.','Demonstra escuta atenta e participa dos momentos de interação durante a leitura.','Relaciona a história a vivências pessoais e ao contexto da turma.','Compartilha ideias respeitando a vez de fala dos colegas.','Justifica oralmente suas escolhas e conexões com a história.'],\n    docs:['Observe se as crianças fazem previsões coerentes com as pistas da capa e se participam ativamente da leitura.','Registre uma fala que mostre uma conexão pessoal com a história, como: “Isso me lembra quando eu fui na praia com minha família.”'] },\n  { title:'Atelier de Artes', color:C.teal, mode:'Guiada pelo educador', bncc:'EI03TS02; EI03EF01', sel:'EI05SEL04; EI05SEL01',\n    results:['Explora e compara os efeitos produzidos por diferentes cores, objetos, marcas e texturas.','Repete ou ajusta uma ação de carimbar depois de observar o efeito obtido.','Escolhe e combina elementos visuais para expressar uma relação entre lugar, ação e sentimento.','Explica uma intenção ou escolha artística usando evidências da própria criação.'],\n    docs:['Registre um teste, repetição ou ajuste realizado depois de a criança observar uma marca, textura ou combinação de cores.','Registre uma fala que explique a relação entre uma escolha visual e o lugar, a ação ou o sentimento que a criança quis comunicar.'] },\n  { title:'Brincar ao Ar Livre', color:C.orange, mode:'Dirigida pela criança', bncc:'EI03EO02; EI03EO03; EI03EO04; EI03CG02', sel:'EI05SEL01; EI05SEL04',\n    results:['Escolhe onde começar, com quem brincar e como usar espaços e materiais conhecidos.','Inicia, sustenta, repete ou transforma uma brincadeira de acordo com o próprio interesse.','Comunica ideias e necessidades e negocia espaço, materiais ou parcerias com respeito.','Cuida dos seres vivos, dos materiais e da própria segurança enquanto brinca.'],\n    docs:['Registre uma escolha iniciada e sustentada pela criança, indicando como ela repetiu, combinou ou transformou a brincadeira.','Registre uma ação de negociação, cuidado ou pedido de ajuda e indique se o apoio do educador foi necessário.'] },\n  { title:'Mural do Projeto', color:C.pink, mode:'Guiada pelo educador', bncc:'EI03EF01', sel:'EI05SEL04; EI05SEL01',\n    results:['Localiza a Imersão como a primeira fase da Jornada do Projeto.','Identifica, em uma evidência do dia, uma relação inicial entre lugar, contato com a natureza, ação ou sentimento.','Contribui com uma primeira ideia ou pergunta para o Mural sem apresentá-la como missão ou solução.','Explica que os registros iniciais podem mudar quando a turma observar e descobrir mais.'],\n    docs:['Registre uma fala que relacione um lugar, a quantidade de contato com a natureza e o que alguém faz ou sente ali.','Registre uma pergunta inicial da criança e indique a evidência do dia que a provocou.'] }\n];\n\nconst BOOKS = [\n  { title:'Caderno de Aprendizagem Integrada', color:C.blue, desc:'Registros individuais das crianças em momentos-chave do projeto.', status:'4 páginas por criança' },\n  { title:'Atividades Fazer e Brincar', color:C.teal, desc:'Jogos, cartões e materiais destacáveis usados nos Centros de Aprendizagem.', status:'16 páginas por criança' },\n  { title:'Pasta Portfólio da Criança', color:C.orange, desc:'Reúne e protege as produções concluídas ao longo do projeto.', status:'1 por criança' },\n  { title:'Painel do Projeto', color:C.pink, desc:'Fases do Projeto, Pergunta Norteadora e Canvas montados ao longo das três semanas.', status:'1 conjunto por sala' }\n];\n\nclass Component extends DCLogic {\n  state = { view:'home', catId:null, entryId:null, tab:'a', lessonId:'a1', query:'', read:[], openWeek:1 };\n\n  nav = (patch) => { this.setState(Object.assign({ query:'' }, patch)); const el = document.querySelector('[data-scroll-body]'); if (el) el.scrollTop = 0; };\n  openEntry = (id) => { const e = LIBRARY.find(x => x.id === id); this.nav({ view:'biblio-detail', catId:e.cat, entryId:id }); };\n\n  renderVals() {\n    const s = this.state;\n    const cat = CATS.find(c => c.id === s.catId) || CATS[0];\n    const entry = LIBRARY.find(e => e.id === s.entryId) || LIBRARY[0];\n    const lesson = LESSONS.find(l => l.id === s.lessonId) || LESSONS[0];\n    const lessonWeek = WEEKS.find(w => w.days.some(d => d.id === lesson.id)) || WEEKS[0];\n    const isRead = s.read.includes(entry.id);\n    const q = s.query.trim().toUpperCase();\n\n    const results = !q ? [] : LIBRARY\n      .filter(e => e.code.toUpperCase().includes(q) || e.title.toUpperCase().includes(q))\n      .slice(0, 5)\n      .map(e => ({\n        title: e.title, sub: e.code + ' · ' + (CATS.find(c => c.id === e.cat) || {}).name, tag: 'Recurso',\n        tagStyle: 'font-size:9px;font-weight:700;letter-spacing:0.08em;padding:3px 8px;border-radius:999px;background:#EEF3FA;color:#123F72;white-space:nowrap',\n        go: () => this.openEntry(e.id)\n      }));\n\n    const crumb = (label, go, last) => ({\n      label, go: go || (() => {}),\n      style: `font-size:11px;cursor:${last ? 'default' : 'pointer'};color:${last ? '#8A8C93' : '#123F72'};font-weight:${last ? '400' : '600'}`,\n      sepStyle: 'font-size:11px;color:#C7CBD4'\n    });\n    let crumbs = [];\n    if (s.view !== 'home') {\n      crumbs = [crumb('Início', () => this.nav({ view:'home' }))];\n      if (s.view === 'roteiros') crumbs.push(crumb('Roteiros do Educador', null, true));\n      if (s.view === 'roteiro') { crumbs.push(crumb('Roteiros do Educador', () => this.nav({ view:'roteiros' }))); crumbs.push(crumb('Semana ' + lessonWeek.n + ' · ' + lesson.code, null, true)); }\n      if (s.view === 'biblio') crumbs.push(crumb('Biblioteca Digital', null, true));\n      if (s.view === 'biblio-list') { crumbs.push(crumb('Biblioteca Digital', () => this.nav({ view:'biblio' }))); crumbs.push(crumb(cat.name, null, true)); }\n      if (s.view === 'biblio-detail') { crumbs.push(crumb('Biblioteca Digital', () => this.nav({ view:'biblio' }))); crumbs.push(crumb(cat.name, () => this.nav({ view:'biblio-list', catId:cat.id }))); crumbs.push(crumb(entry.title, null, true)); }\n      if (s.view === 'cadernos') crumbs.push(crumb('Materiais da Criança', null, true));\n    }\n    crumbs = crumbs.map((c, i) => Object.assign({}, c, { sepStyle: i === 0 ? 'display:none' : c.sepStyle }));\n\n    const cardStyle = (color) => `position:relative;background:#fff;border:1px solid #E9EAEE;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 2px 10px rgba(21,24,29,.05)`;\n    const openers = {};\n    LIBRARY.forEach(e => { openers[e.id] = () => this.openEntry(e.id); });\n\n    const tab = (on) => `font-size:11.5px;font-weight:600;padding:7px 12px;border-radius:7px;cursor:pointer;transition:background .18s,color .18s;background:${on?'#FFFFFF':'transparent'};color:${on?'#123F72':'#8A8C93'};box-shadow:${on?'0 1px 3px rgba(21,24,29,.12)':'none'}`;\n\n    return {\n      goHome: () => this.nav({ view:'home' }),\n      isHome: s.view === 'home',\n      isRoteiros: s.view === 'roteiros',\n      isRoteiro: s.view === 'roteiro',\n      isBiblioTiles: s.view === 'biblio',\n      isBiblioList: s.view === 'biblio-list',\n      isBiblioDetail: s.view === 'biblio-detail',\n      isCadernos: s.view === 'cadernos',\n      showCrumbs: s.view !== 'home',\n      crumbs,\n      query: s.query,\n      onQuery: (e) => this.setState({ query: e.target.value }),\n      results, hasResults: results.length > 0,\n\n      cards: [\n        { title:'Roteiros do Educador', kicker:'9 DE 9 AULAS', desc:'Planos de aula organizados por semana, com links diretos para os recursos da Biblioteca Digital.', meta:'Semanas 1, 2 e 3 disponíveis', color:C.blue, go:() => this.nav({ view:'roteiros' }) },\n        { title:'Biblioteca Digital', kicker:'25 ENTRADAS', desc:'Rotinas, estratégias de ensino, materiais e propostas que apoiam a implementação do projeto.', meta:'Acesso no momento em que você precisa', color:C.teal, go:() => this.nav({ view:'biblio' }) },\n        { title:'Materiais da Criança', kicker:'KIT CRIANÇA E KIT SALA', desc:'Cadernos, atividades destacáveis, portfólio e painel do projeto usados ao longo das três semanas.', meta:'Referência de páginas e quantidades', color:C.orange, go:() => this.nav({ view:'cadernos' }) }\n      ].map(c => ({\n        title:c.title, kicker:c.kicker, desc:c.desc, meta:c.meta, go:c.go,\n        style: cardStyle(c.color),\n        stripStyle: `position:absolute;left:0;top:0;bottom:0;width:7px;background:${c.color}`,\n        kickerStyle: `font-size:9.5px;font-weight:700;letter-spacing:0.16em;color:${c.color}`,\n        ruleStyle: `width:38px;height:2px;background:${c.color};margin:12px 0 12px 0`\n      })),\n\n      weeks: WEEKS.map(w => ({\n        n:w.n, fase:w.fase, milestone:w.milestone,\n        open: s.openWeek === w.n && w.active,\n        toggle: () => w.active && this.setState({ openWeek: s.openWeek === w.n ? 0 : w.n }),\n        headerStyle: `display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:${w.active ? 'pointer' : 'default'};transition:background .18s;opacity:${w.active ? 1 : .55}`,\n        chevronStyle: `font-size:16px;color:#A6B6CB;transform:rotate(${s.openWeek === w.n && w.active ? 90 : 0}deg);transition:transform .2s`,\n        dotStyle: `width:9px;height:9px;border-radius:50%;background:${w.color}`,\n        statusStyle: `margin-left:auto;font-size:10px;font-weight:700;letter-spacing:0.1em;color:${w.active ? '#17AFB9' : '#C7CBD4'}`,\n        status: w.active ? 'DISPONÍVEL' : 'EM BREVE',\n        days: w.days.map(d => ({\n          n:d.n, title:d.title, code:d.code,\n          go: () => d.ready && this.nav({ view:'roteiro', lessonId:d.id }),\n          style: `display:flex;align-items:center;gap:12px;padding:11px 14px;background:#FAFBFC;border:1px solid #EDEEF2;border-left:4px solid ${d.ready ? w.color : '#DDE0E6'};border-radius:9px;cursor:${d.ready ? 'pointer' : 'default'};transition:background .18s,border-color .18s;opacity:${d.ready ? 1 : .55}`,\n          numStyle: `width:24px;height:24px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:${d.ready ? w.color : '#C7CBD4'}`,\n          badgeStyle: `font-size:9.5px;font-weight:700;letter-spacing:0.1em;color:${d.ready ? '#17AFB9' : '#C7CBD4'}`,\n          badge: d.ready ? 'ABRIR' : 'EM BREVE'\n        }))\n      })),\n\n      categories: CATS.map(c => ({\n        name:c.name, typeLabel:c.typeLabel, subtitle:c.subtitle,\n        count: LIBRARY.filter(e => e.cat === c.id).length,\n        go: () => this.nav({ view:'biblio-list', catId:c.id }),\n        style: `background:#fff;border:1px solid #E9EAEE;border-left:5px solid ${c.accent};border-radius:14px;padding:20px 22px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 2px 10px rgba(21,24,29,.05)`,\n        kickerStyle: `font-size:9.5px;font-weight:700;letter-spacing:0.16em;color:${c.accent}`\n      })),\n\n      cat: { name: cat.name, typeLabel: cat.typeLabel, subtitle: cat.subtitle },\n      catKickerStyle: `font-size:10px;font-weight:700;letter-spacing:0.16em;color:${cat.accent}`,\n      catItems: LIBRARY.filter(e => e.cat === cat.id).map(e => {\n        const read = s.read.includes(e.id);\n        return {\n          code:e.code, title:e.title, summary:e.summary,\n          go: () => this.openEntry(e.id),\n          style: `background:#fff;border:1px solid #E9EAEE;border-left:4px solid ${cat.accent};border-radius:12px;padding:16px 18px;cursor:pointer;transition:transform .2s,box-shadow .2s`,\n          codeStyle: `font-size:10px;font-weight:700;letter-spacing:0.06em;padding:2px 8px;border-radius:5px;border:1.5px solid ${cat.accent};color:${cat.accent}`,\n          seenStyle: `font-size:9px;font-weight:700;letter-spacing:0.1em;color:${read ? '#17AFB9' : 'transparent'}`,\n          seenLabel: read ? 'LIDA' : ''\n        };\n      }),\n\n      entry: {\n        title: entry.title, kind: (CATS.find(c => c.id === entry.cat) || {}).typeLabel, summary: entry.summary, tip: entry.tip,\n        steps: entry.steps.map((t, i) => ({ n: i + 1, t })),\n        numStyle: `width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;background:${cat.accent}`,\n        usedIn: (entry.usedIn || []).map(id => { const l = LESSONS.find(x => x.id === id); return { label: l.code + ' · ' + l.title, go: () => this.nav({ view:'roteiro', lessonId:id }) }; }),\n        hasUsedIn: (entry.usedIn || []).length > 0\n      },\n      entryKindStyle: `font-size:10px;font-weight:700;letter-spacing:0.16em;color:${cat.accent}`,\n      entryTipStyle: `margin-top:22px;border-left:3px solid ${cat.accent};background:${TINT[cat.accent]};padding:14px 16px;color:${cat.accent}`,\n      backToList: () => this.nav({ view:'biblio-list', catId:cat.id }),\n      markRead: () => this.setState(st => ({ read: st.read.includes(entry.id) ? st.read.filter(x => x !== entry.id) : st.read.concat(entry.id) })),\n      readLabel: isRead ? '✓ Lida' : 'Marcar como lida',\n      readBtnStyle: `font-size:11.5px;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer;transition:opacity .18s;color:#fff;background:${isRead ? '#17AFB9' : cat.accent}`,\n\n      openers,\n      lessonTabs: lessonWeek.days.map(d => ({\n        label: d.code, go: () => this.setState({ lessonId: d.id }),\n        style: tab(s.lessonId === d.id)\n      })),\n      lesson: {\n        code: lesson.code, title: lesson.title, fase: lesson.fase, modo: lesson.modo, minutos: lesson.minutos,\n        objetivo: lesson.objetivo, bncc: lesson.bncc, eixos: lesson.eixos,\n        kickerStyle: `font-size:10.5px;font-weight:700;letter-spacing:0.14em;color:${lesson.color}`,\n        titleStyle: `font-weight:700;color:${lesson.color}`,\n        resultados: lesson.resultados,\n        documentacao: lesson.documentacao,\n        momentos: lesson.momentos.map((m, i) => ({\n          n: i + 1, title: m.tit
