    // its OWN frames — from local text at the root, or text obtained from

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

      // and sender identity (own child frame / direct parent) is checked

    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};

    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7889d281-84b0-412b-8274-de863acc7327\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* devanagari */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"1784145f-62b3-48c7-a4ea-f892760a8d49\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF4, U+1CF7-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B0A;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"2a5a2c85-a96f-453b-abf4-0d04cefb3fbd\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"d63586e3-572b-4915-95d0-ccc769052ab9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* devanagari */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"e71ecbc7-aab2-406f-9090-cadef4926f2a\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF4, U+1CF7-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B0A;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"472f9159-abfd-414f-acdb-f761cf24d831\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"6a4dcab8-1ddb-473a-9639-1e5324230af8\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root{\n  /* Brand */\n  --purple-900:#33194A;\n  --purple-700:#5E3A7C;\n  --purple-600:#764897; /* primary brand purple — Educação Infantil */\n  --purple-300:#B99ECE;\n  --purple-100:#EFE8F4;\n  --blue-400:#9FBDF5;\n  --blue-300:#BFD3FA;\n  --blue-200:#DBE7FF; /* secondary light blue */\n  --blue-100:#EDF3FF;\n\n  /* Ink + paper neutrals */\n  --ink-900:#0B0B14;\n  --ink-700:#33333D;\n  --ink-500:#5E5E68;\n  --ink-300:#93938F;\n  --rule-300:#DFDDD6;\n  --rule-200:#EBE9E3;\n  --paper-200:#F1EFE9;\n  --paper-100:#F8F6F1;\n  --paper-000:#FFFFFF;\n\n  /* Semantic text */\n  --text-primary:var(--ink-900);\n  --text-secondary:var(--ink-700);\n  --text-muted:var(--ink-500);\n  --text-brand:var(--purple-600);\n  --text-on-brand:var(--paper-000);\n  --text-on-panel:var(--ink-900);\n\n  /* Semantic surfaces */\n  --surface-page:var(--paper-000);\n  --surface-paper:var(--paper-100);\n  --surface-panel:var(--blue-200);\n  --surface-panel-soft:var(--blue-100);\n  --surface-brand:var(--purple-600);\n  --surface-brand-soft:var(--purple-100);\n  --surface-workspace:var(--paper-000);\n\n  /* Semantic lines + marks */\n  --border-rule:var(--rule-300);\n  --border-hairline:var(--rule-200);\n  --border-workspace:var(--rule-300);\n  --mark-annotation:var(--purple-600); /* hand-drawn traces of thinking */\n  --mark-pencil:var(--ink-300);\n\n  /* Interactive (family-facing / digital only) */\n  --action-rest:var(--purple-600);\n  --action-hover:var(--purple-700);\n  --action-press:var(--purple-900);\n  --focus-ring:var(--purple-600);\n}\n\n/* Lesson colours — Orientações do Educador.\n   Four aulas per day, each recognisable at a glance. All four are tuned to sit\n   beside brand purple #764897: same chroma register, evenly spaced in hue.\n   Aula 1 IS the brand purple; aula 2 is the hue of the secondary light blue.\n   Each lesson has three values only: ink (type, rules, numerals),\n   fill (saturated block carrying white type) and soft (page-safe panel). */\n:root{\n  --lesson-1-ink:#5E3A7C;\n  --lesson-1-fill:#764897;\n  --lesson-1-soft:#EFE8F4;\n\n  --lesson-2-ink:#24509E;\n  --lesson-2-fill:#2F62CE;\n  --lesson-2-soft:#DBE7FF;\n\n  --lesson-3-ink:#16564B;\n  --lesson-3-fill:#1C6C5E;\n  --lesson-3-soft:#DCEDE8;\n\n  --lesson-4-ink:#8A4516;\n  --lesson-4-fill:#A0521A;\n  --lesson-4-soft:#FAE7D6;\n}\n\n/* Caderno de Aprendizagem — page chrome (collection-level tokens).\n   Full product spec lives in the Caderno's own Briefing de Design (v1, out 2026):\n   https://claude.ai/design/p/d39e85d6-ea08-4cb9-96ba-fe66a276498f\n   B4 landscape 353 × 250 mm. Design px ≈ 3.935 px/mm. */\n:root{\n  /* Page geometry — B4 paisagem 353 × 250 mm, micro-picote, frente e verso */\n  --caderno-w:1389px;\n  --caderno-h:984px;\n  --caderno-margin:31px 51px;     /* 8 mm topo/base · 13 mm laterais */\n  --caderno-header-h:106px;\n  --caderno-rule-w:2px;\n  --caderno-gutter:16px;\n\n  /* Chrome palette — igual em todas as folhas */\n  --caderno-purple:var(--purple-600); /* #764897 */\n  --caderno-purple-soft:#9672AF;  /* nome do projeto, código da página */\n  --caderno-purple-faint:#BFAACE; /* molduras desenhadas */\n  --caderno-lavender:#F5F2F8;     /* pílulas NOME/DATA e rodapé */\n  --caderno-outline:#C2C2C2;      /* contorno do painel, pautas */\n  --caderno-mist:#EDF3FF;         /* verso: Resultados de Aprendizagem */\n  --caderno-dotted:#9FBDF5;       /* verso: pontilhado azul dos blocos à família */\n\n  /* Cores de tipo de aula (PROPOSTA · oklch L .58 C .12). Única aplicação: ícone,\n     barra do título, as duas réguas, filete e ponto do rodapé. Nunca no corpo. */\n  --aula-mural:#9264AD;\n  --aula-conto:#B0597E;\n  --aula-arte:#B55F40;\n  --aula-dramatico:#9B7300;\n  --aula-ciencia:#5A8A3D;\n  --aula-centros:#00917D;\n  --aula-letramento:#4F7AC1;\n\n  /* A página define --caderno-lesson com uma --aula-*; sem aula, a moldura é roxa. */\n  --caderno-accent:var(--caderno-lesson,var(--caderno-purple)); /* barra do título */\n  --caderno-rule:var(--caderno-lesson,var(--caderno-purple));   /* as duas réguas */\n\n  /* Semantic aliases used by the components */\n  --caderno-ink:var(--caderno-purple);\n  --caderno-ink-soft:var(--caderno-purple-soft);\n  --caderno-ink-faint:var(--caderno-purple-faint);\n  --caderno-panel:var(--caderno-lavender);\n  --caderno-panel-line:var(--caderno-outline);\n\n  /* Radii */\n  --caderno-radius-pill:14px;\n  --caderno-radius-panel:20px;\n  --caderno-radius-page-no:10px;\n\n  /* Fases NÃO têm cor: ícone de linha roxo + nome. Mantidos como alias para compatibilidade. */\n  --phase-investigacao:var(--caderno-purple);\n  --phase-imersao:var(--caderno-purple);\n\n  /* RETIRADOS pelo Briefing de Design v1 — não usar em novas peças.\n     Mantidos só para não quebrar arte antiga. Teal → cor da aula; âmbar → cor da aula. */\n  --caderno-teal:var(--caderno-rule);\n  --caderno-amber:var(--caderno-accent);\n  --caderno-leaf:#5DAB38;\n}\n\n:root{\n  --font-display:\"Poppins\",\"Poppins Fallback\",system-ui,sans-serif; /* brand voice, titles, invitations */\n  --font-text:\"Figtree\",\"Figtree Fallback\",system-ui,sans-serif;    /* running text, educator notes, captions */\n\n  --weight-light:300;\n  --weight-regular:400;\n  --weight-medium:500;\n  --weight-semibold:600;\n\n  /* Print-first scale (px at 1:1 on A4/Letter artwork) */\n  --size-eyebrow:13px;\n  --size-caption:14px;\n  --size-note:16px;\n  --size-body:19px;\n  --size-body-lg:22px;\n  --size-invitation:34px;\n  --size-title:46px;\n  --size-display:64px;\n  --size-display-xl:88px;\n\n  --leading-tight:1.06;\n  --leading-snug:1.18;\n  --leading-normal:1.45;\n  --leading-loose:1.6;\n\n  --tracking-eyebrow:0.14em;\n  --tracking-title:-0.015em;\n  --tracking-normal:0em;\n\n  /* Semantic roles */\n  --type-eyebrow:var(--weight-regular) var(--size-eyebrow)/var(--leading-normal) var(--font-display);\n  --type-invitation:var(--weight-medium) var(--size-invitation)/var(--leading-snug) var(--font-display);\n  --type-title:var(--weight-semibold) var(--size-title)/var(--leading-tight) var(--font-display);\n  --type-display:var(--weight-semibold) var(--size-display)/var(--leading-tight) var(--font-display);\n  --type-body:var(--weight-regular) var(--size-body)/var(--leading-normal) var(--font-text);\n  --type-note:var(--weight-regular) var(--size-note)/var(--leading-normal) var(--font-text);\n  --type-caption:var(--weight-regular) var(--size-caption)/var(--leading-normal) var(--font-text);\n  --type-label:var(--weight-semibold) var(--size-caption)/var(--leading-normal) var(--font-text);\n}\n\n:root{\n  --space-1:4px;\n  --space-2:8px;\n  --space-3:12px;\n  --space-4:16px;\n  --space-5:24px;\n  --space-6:32px;\n  --space-7:48px;\n  --space-8:64px;\n  --space-9:96px;\n  --space-10:128px;\n\n  /* Page geometry (A4 artwork, 96dpi ≈ 794×1123) */\n  --page-w:794px;\n  --page-h:1123px;\n  --page-margin:64px;\n  --page-margin-wide:96px;\n  --page-gutter:32px;\n  --measure-body:62ch;   /* max line length for running text */\n  --measure-invitation:26ch;\n}\n\n:root{\n  --radius-0:0px;      /* default: editorial, square */\n  --radius-sm:3px;     /* tags, chips */\n  --radius-md:6px;     /* photo frames, panels */\n  --radius-pill:999px; /* interactive buttons only */\n\n  --border-width-hairline:1px;\n  --border-width-rule:2px;\n  --border-width-workspace:1.5px;\n\n  /* Print materials carry no shadows. These exist for family-facing screens only. */\n  --shadow-none:none;\n  --shadow-raised:0 1px 2px rgba(11,11,20,.06),0 8px 24px rgba(11,11,20,.06);\n  --shadow-photo:0 2px 10px rgba(11,11,20,.08);\n\n  --ease-standard:cubic-bezier(.2,.6,.2,1); /* @kind other */\n  --duration-fast:120ms; /* @kind other */\n  --duration-base:200ms; /* @kind other */\n}\n\n<\u002Fstyle>\n<script src=\"e44703ac-50da-454d-87df-00fde54a0204\"><\u002Fscript>\n<style>body{margin:0}a{color:#764897}a:hover{color:#5d3a79}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#F5F2F8;display:flex;flex-direction:column;font-family:Figtree,sans-serif;color:#0B0B14;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1px solid #E4DDEC;background:#fff\">\n    <div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:16px\">{{ title }}<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <span style=\"font-size:14px\">{{ counter }}<\u002Fspan>\n      \n      <button sc-camel-on-click=\"{{ toggleMode }}\" style=\"font:600 14px Figtree,sans-serif;color:#764897;background:#fff;border:1.5px solid #764897;border-radius:999px;padding:8px 16px;cursor:pointer\" style-hover=\"background:#F5F2F8\">{{ modeLabel }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ fullscreen }}\" style=\"font:600 14px Figtree,sans-serif;color:#fff;background:#764897;border:0;border-radius:999px;padding:9px 16px;cursor:pointer\" style-hover=\"background:#5d3a79\">Tela cheia<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ empty }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;padding:32px\">\n      <div style=\"max-width:520px;text-align:center\"><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:34px;line-height:1.1;margin-bottom:12px\">{{ status }}<\u002Fdiv><div style=\"font-size:16px;line-heigh 6 / 72;\n          const v = pg.getViewport({ scale: 2 * 96 / 72 });\n          const c = document.createElement('canvas'); c.width = v.width; c.height = v.height;\n          await pg.render({ canvasContext: c.getContext('2d'), viewport: v }).promise;\n          pages.push(c.toDataURL('image/jpeg', 0.85));\n          this.setState({ status: 'Carregando página ' + i + ' de ' + doc.numPages });\n        }\n      } else {\n        files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));\n        for (const f of files) pages.push(await this.readURL(f));\n      }\n      const halves = [pages[0]]; let ratio = 0.707;\n      for (const p of pages.slice(1, -1)) {\n        const im = new Image(); im.src = p; await im.decode();\n        const hw = Math.floor(im.naturalWidth / 2), c = document.createElement('canvas'); c.width = hw; c.height = im.naturalHeight;\n        const x = c.getContext('2d'); ratio = hw / im.naturalHeight;\n        for (const sx of [0, hw]) { x.drawImage(im, sx, 0, hw, im.naturalHeight, 0, 0, hw, im.naturalHeight); halves.push(c.toDataURL('image/jpeg', 0.85)); }\n      }\n      halves.push(pages[pages.length - 1]);\n      this.setState({ natH, pages: halves, flip: 0, spreads: pages.length - 2, ratio, loading: false });\n    } catch (e) { this.setState({ err: true, loading: false, status: 'Não foi possível ler o arquivo' }); }\n  }\n  renderVals() {\n    const { pages, flip, w, h, loading, status } = this.state;\n    const ratio = this.state.ratio || 1, n = pages.length;\n    const ph = Math.max(240, Math.min(this.state.natH || 1e5, h - 160, (w - 160) / ratio / (this.state.single ? 1 : 2))), pw = Math.round(ph * ratio);\n    const L = Math.ceil(n / 2), single = this.state.single;\n    const leaves = Array.from({ length: L }, (_, i) => ({ front: pages[2 * i] || this.BLANK, back: pages[2 * i + 1] || this.BLANK, fi: 2 * i, bi: 2 * i + 1, deg: i < flip ? -180 : 0, z: i < flip ? i : L - i }));\n    const shift = single ? 0 : flip === 0
