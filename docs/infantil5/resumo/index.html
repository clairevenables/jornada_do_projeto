</style></head><body><header><div class="brand">Intercriativa Lab<small>Educação Infantil · Resumo do projeto</small></div><div class="hero"><span class="tag">INFANTIL 5 · PROJETO 2</span><h1>A Natureza é<br>Para Todos 🌿</h1><p>As pessoas e a natureza cuidam umas das outras: tempo ao ar livre ajuda a gente a crescer bem, e o nosso cuidado ajuda a natureza a ficar bem.</p><div class="facts"><span>Infantil 5</span><span>3 semanas</span><span>Vida ao Ar Livre</span><span>ODS 11</span></div></div></header><main><div class="layout"><nav id="nav"></nav><article><div id="content"></div><div class="actions"><button id="prev">← Anterior</button><span id="counter"></span><button id="next">Próxima →</button></div></article></div></main><script>const sections=[{"title": "Pergunta norteadora e missão", "items": ["PERGUNTA NORTEADORA: Como a natureza muda o jeito que a gente se sente, brinca e aprende?", "MISSÃO: Como podemos trazer mais natureza para os lugares onde as crianças brincam na escola?"]}, {"title": "Resumo do projeto", "items": ["Neste projeto, as crianças investigam como estar na natureza muda o jeito que o corpo e a mente se sentem, e descobrem quanto da vida da escola acontece de fato em contato com a natureza. Elas comparam experiências dentro e fora, coletam evidências sobre como as pessoas se sentem em cada lugar, observam quais espaços da escola têm natureza e quais não têm, e investigam quem consegue brincar na natureza todos os dias e quem não consegue.", "Ao longo do projeto, as crianças exploram a escola como investigadoras e como transformadoras. Medem e registram o uso dos espaços, entrevistam outras turmas e adultos sobre onde brincam e como se sentem, estudam o que as plantas e os seres vivos precisam para viver bem nos espaços da escola, buscam ideias em livros e outras fontes e experimentam pequenas mudanças: levar natureza para um canto sem vida, criar um caminho novo, plantar, construir com materiais naturais.", "A turma escolhe um problema real ligado ao acesso à natureza na escola e cria uma solução para ajudar um grupo real, como as turmas menores, uma turma específica ou a escola toda. A solução não é definida antes. Pode ser um cantinho de natureza em um espaço esquecido, um jardim ou horta que todos possam usar, um circuito de brincar na natureza, materiais naturais para o pátio, uma rotina nova de uso dos espaços, placas e convites que chamam para fora ou outra ideia criada pelas crianças com apoio dos adultos.", "A solução será testada com pessoas reais, em ciclos de tentativa e melhoria: as crianças observam se mais gente brinca na natureza, se o espaço novo é usado e cuidado, se o corpo e a mente das pessoas se sentem melhor. Depois, a turma melhora a solução e a apresenta à comunidade escolar, para que a mudança continue depois do projeto."]}, {"title": "Justificativa", "items": ["As crianças de hoje passam cada vez mais tempo em espaços fechados e diante de telas, e cada vez menos tempo em contato com a natureza. Essa mudança tem efeitos reais sobre o corpo, o sono, a atenção e as emoções, e cria uma distância crescente entre as crianças e o mundo vivo. Dentro de uma escola, esse problema tem um mapa preciso: existem espaços com natureza e espaços sem, rotinas que levam para fora e rotinas que prendem dentro, e crianças que sentem essa diferença todos os dias sem ter palavras para ela.", "Aos cinco anos, as crianças conseguem investigar essa relação de corpo e mente com profundidade real: comparar experiências e descrever sensações, coletar e registrar evidências com números, desenhos e escrita espontânea, prever e observar transformações, buscar informações em fontes e apresentar conclusões para públicos diversos. Também têm força social dentro da escola: são as mais velhas da Educação Infantil, e o que elas constroem e defendem influencia as turmas menores.", "Este projeto dá à turma o papel de transformar a própria escola. As crianças não apenas estudam a natureza: medem o acesso a ela, sentem sua falta e seu efeito, e mudam o que está ao seu alcance para que todos possam viver isso todos os dias. Assim, desenvolvem investigação, evidência, cuidado com a vida, senso de comunidade e a experiência concreta de que crianças podem melhorar um lugar de verdade."]}, {"title": "Lançamento do projeto", "items": ["A turma faz duas experiências no mesmo dia, planejadas pela educadora: uma brincadeira em um espaço interno e a mesma brincadeira em um espaço com natureza. Depois de cada uma, as crianças registram como o corpo e a mente se sentem, com desenhos, palavras e escolhas em uma escala visual. No fim do dia, a educadora coloca os dois registros lado a lado e pensa em voz alta com a turma: foi diferente? O que mudou no corpo? E por dentro? Em seguida, lança o desafio: os lugares onde a gente brinca na nossa escola têm natureza? Onde ela está, e onde falta? A turma percebe que não sabe a resposta, e que pode descobrir."]}, {"title": "Expectativas de aprendizagem", "items": ["Ao longo do projeto, espera-se que as crianças:", "• Comparem experiências dentro e fora, descrevendo como o corpo e a mente se sentem em cada uma.", "• Estabeleçam comparações entre espaços da escola, observando suas propriedades e usos.", "• Observem, descrevam e prevejam mudanças em experimentos e transformações da natureza.", "• Selecionem fontes de informação para responder perguntas sobre a natureza e sua conservação.", "• Registrem observações, contagens e medidas com desenhos, números e escrita espontânea, em diferentes suportes.", "• Construam gráficos simples para comparar usos e preferências dos espaços.", "• Classifiquem espaços, materiais e seres vivos por mais de um atributo, explicando os critérios.", "• Demonstrem controle e adequação do corpo em brincadeiras e construções ao ar livre.", "• Coordenem habilidades manuais em tarefas reais de plantio, construção e cuidado.", "• Levantem hipóteses sobre textos informativos e usem placas, legendas e convites com função real.", "• Comuniquem descobertas e propostas a públicos diversos, com apoio de registros e evidências.", "• Testem a solução em ciclos de tentativa e melhoria, com apoio decrescente do adulto.", "• Percebam se a solução ajudou, não ajudou ou precisa mudar, usando as evidências coletadas.", "• Participem da construção do Mural do Projeto com fotos, registros, gráficos, falas, escrita espontânea e evidências dos testes."]}, {"title": "Conexões fundamentais", "items": ["As crianças devem construir as seguintes compreensões:", "• Estar na natureza muda como o corpo e a mente se sentem, e a gente pode perceber e mostrar essa diferença.", "• Nem todo mundo tem natureza por perto todos os dias, e isso pode ser mudado.", "• Um espaço muda quando as pessoas cuidam dele, e um espaço cuidado muda as pessoas.", "• A natureza precisa de condições para viver bem, e nossas escolhas afetam essas condições.", "• Evidências, como registros, medidas e gráficos, ajudam a convencer as pessoas de uma ideia.", "• Mudanças de verdade precisam ser mantidas: quem vem depois também precisa cuidar.", "• Podemos observar e medir antes de decidir como ajudar.", "• Uma ideia precisa ser testada em situações reais para sabermos se ajudou.", "• Quando algo não funciona, podemos mudar e tentar de novo."]}, {"title": "Conhecimentos-chave", "items": ["As crianças vão construir conhecimento sobre:", "• Sensações do corpo e da mente: calmo, agitado, cansado, animado, concentrado e livre.", "• Os espaços da escola: onde há natureza, onde não há, como são usados e por quem.", "• O que a natureza precisa para viver nos espaços da escola: água, luz, sombra, terra, proteção e cuidado contínuo.", "• Plantio e construção: sementes, mudas, ferramentas, materiais naturais e etapas de um plantio.", "• Medidas e evidências: contagem, comparação, gráficos simples e registros ao longo do tempo.", "• Entrevistas e coleta de opiniões: perguntas, escalas visuais e registro de respostas.", "• Fontes de informação: livros informativos, pessoas que sabem e exemplos de outras escolas.", "• Textos com função real: placas, legendas, convites, pedidos e apresentações.", "• Cuidado que permanece: combinados, rotinas de manutenção e passagem de responsabilidade.", "• Teste e melhoria: observar, tentar, usar, medir, perceber, mudar e testar novamente."]}, {"title": "Desafio e produto final", "items": ["A turma deverá criar, testar e melhorar uma solução para trazer mais natureza para os lugares onde as crianças brincam na escola. A solução deve nascer da investigação das crianças. Ela não será definida no início do projeto.", "O produto final poderá assumir diferentes formas, dependendo do problema escolhido pela turma, como: um cantinho de natureza em um espaço esquecido, um jardim ou horta de uso comum, um circuito de brincar na natureza, materiais naturais para o pátio, uma rotina nova de uso dos espaços, placas e convites que chamam para fora ou outra ideia criada pelas crianças.", "O produto final precisa cumprir três condições:", "1. Ajudar um grupo real da escola a ter mais natureza no seu dia a dia.", "2. Ser usado ou experimentado por esse grupo em situações reais, em mais de um ciclo de teste.", "3. Gerar evidências simples de impacto, como fotos, medidas, gráficos, falas, mais pessoas brincando na natureza ou mudanças percebidas nos espaços e nas rotinas."]}, {"title": "Voz e escolha das crianças", "items": ["As crianças terão voz e escolha ao:", "• Contar como o corpo e a mente se sentem em diferentes lugares da escola.", "• Escolher os espaços para investigar, medir e transformar.", "• Escolher quem entrevistar e o que perguntar sobre brincar na natureza.", "• Escolher experimentos, plantios, materiais e formas de registro.", "• Escolher, com apoio do adulto, qual problema de acesso à natureza a turma quer resolver.", "• Sugerir ideias para ajudar um grupo real da escola.", "• Participar da criação da solução usando construção, plantio, mapa, placa, desenho, fotos, gráfico, escrita espontânea ou escolha de materiais.", "• Decidir como apresentar a mudança à comunidade escolar.", "• Observar os testes da solução e decidir, com base nas evidências, o que deve continuar, mudar ou ser acrescentado."]}, {"title": "Objetivos de Desenvolvimento Sustentável", "items": ["ODS 11: Cidades e Comunidades Sustentáveis", "O ODS 11 busca tornar cidades e comunidades mais inclusivas, seguras, resilientes e sustentáveis. Na Educação Infantil, isso começa quando as crianças observam e melhoram os espaços que usam todos os dias, pensando em como a escola pode ter mais natureza, sombra, vida e lugares saudáveis para brincar e aprender."]}, {"title": "Possibilidades de pesquisa de campo e atividades de campo", "items": ["Viver a mesma experiência dentro e fora e registrar como o corpo e a mente se sentem.", "Mapear os espaços da escola: onde há natureza, onde não há e como cada um é usado.", "Observar e contar quem usa cada espaço em momentos diferentes do dia.", "Entrevistar outras turmas e adultos sobre onde gostam de brincar e como se sentem.", "Acompanhar um plantio do começo, medindo e registrando as mudanças.", "Fazer experimentos sobre o que as plantas precisam para viver nos espaços da escola.", "Procurar em livros e outras fontes ideias de escolas e pátios com mais natureza.", "Conversar com um adulto que cuida dos espaços da escola sobre o que é possível mudar.", "Conversar com famílias sobre onde as crianças brincam fora da escola.", "Visitar um parque, praça ou espaço verde próximo e registrar o que faz dele um bom lugar para brincar.", "Testar uma pequena mudança em um espaço real e medir se mais pessoas o usam.", "Apresentar as evidências e a solução à comunidade escolar e registrar as reações."]}];const nav=document.getElementById('nav'),content=document.getElementById('content');let active=0;function esc(t){return t.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}sections.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s.title;b.onclick=()=>show(i);nav.appendChild(b);let sec=document.createElement('section');let h=document.createElement('h2');h.textContent=s.title;sec.appendChild(h);s.items.forEach((line,j)=>{let el=document.createElement('div');if(line.startsWith('• ')){el.className='item check';let input=document.createElement('input');input.type='checkbox';input.setAttribute('aria-label','Marcar item');let span=document.createElement('span');span.textContent=line.slice(2);el.append(input,span)}else if(/^\d+\. /.test(line)){el.className='item';el.textContent=line}else if(line.startsWith('PERGUNTA NORTEADORA:')||line.startsWith('MISSÃO:')){el.className='question'+(line.startsWith('MISSÃO:')?' gold':'');let [k,...v]=line.split(':');let strong=document.createElement('strong');strong.textContent=k;let txt=document.createElement('div');txt.textContent=v.join(':').trim();el.append(strong,txt)}else{el=document.createElement('p');el.textContent=line}sec.appendChild(el)});content.appendChild(sec)});function show(i){active=Math.max(0,Math.min(i,sections.length-1));[...nav.children].forEach((x,j)=>x.classList.toggle('active',j===active));[...content.children].forEach((x,j)=>x.classList.toggle('active',j===active));document.getElementById('counter').textContent=(active+1)+' / '+sections.length;document.getElementById('prev').disabled=active===0;document.getElementById('next').disabled=active===sections.length-1;window.scrollTo({top:Math.min(window.scrollY,260),behavior:'smooth'})}document.getElementById('prev').onclick=()=>show(active-1);document.getElementById('next').onclick=()=>show(active+1);show(0);</script></body></html>
